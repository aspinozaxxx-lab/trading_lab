hypothesis:
  statement: >-
    An official increase in the level-1 MOEX clearing market-risk rate for one of the
    four V27 underlyings can identify a temporarily less stable risk regime. Setting
    only that asset's already-governed target to zero for the next weekly holding
    interval may retain at least 20 percent CAGR in every cost scenario while reducing
    drawdown without increasing any parent risk.
  economic_mechanism:
    - MR1_is_the_official_level_1_market_risk_rate_used_by_clearing
    - a_positive_week_over_week_MR1_change_is_an_exchange_risk_escalation
    - asset_specific_reduction_preserves_unrelated_trend_exposures
    - unchanged_or_lower_MR1_never_increases_the_parent_target
    - no_percentile_level_or_outcome_fitted_boundary_is_used
  primary_comparison: frozen_V27_scenario_references

