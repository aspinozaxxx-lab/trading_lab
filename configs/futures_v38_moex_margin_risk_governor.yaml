  source_start: '2018-05-22'
  oos_start: '2021-01-01'
  oos_end: '2025-12-31'
  forbidden_from: '2026-01-01'
  timezone: Europe/Moscow

universe:
  exact_order: [SI, RI, BR, MIX]
  source_assetcode_mapping: {SI: Si, RI: RTS, BR: BR, MIX: MIX}
  mapping_fit: none_official_underlying_codes

information_set:
  decision_at: 23_59_59_Europe_Moscow_on_each_frozen_V27_weekly_decision_date
  row_selection: latest_available_at_not_after_decision_for_each_source_assetcode
  row_tradedate_must_not_exceed_decision_date: true
  maximum_current_row_age_calendar_days: 7
  comparison: latest_selected_MR1_minus_MR1_selected_at_immediately_previous_weekly_decision
  previous_weekly_decision_must_be_strictly_earlier: true
  original_updatetime_and_available_at_required: true
  future_columns_forbidden: [future_mr1, open_D_plus_1, settle_D_plus_1, return_D_plus_1, target, pnl]
  no_zero_imputation: true

margin_risk_governor:
  id: official_MOEX_MR1_weekly_asset_specific_increase_cash
  source_field: mr1
  source_field_meaning: official_level_1_market_risk_rate
  threshold: exact_positive_change_above_zero
  threshold_fit: none_structural_zero_change
  pass_state: current_and_previous_fresh_complete_and_current_MR1_less_than_or_equal_to_previous_MR1
  cash_state: current_MR1_greater_than_previous_MR1_or_current_or_previous_missing_or_stale
  admitted_scale: 1.0
  cash_scale: 0.0
  application: multiply_each_frozen_V27_asset_target_before_exact_2x
  scale_can_increase_parent_risk: false
  global_cross_asset_cash_switch: false
  smoothing_hysteresis_percentiles_and_partial_scales: forbidden
  mr2_mr3_lk1_lk2_staticparams_and_cashflow_used_by_v38: false

capital_execution_and_costs:
  inherited_byte_identical_from_V27: true
  target_weight_multiplier_after_all_governors: 2.0
  maximum_gross_notional_multiple: 2.0
  initial_margin_buffer_multiple: 2.0
  collateral_RUONIA_fraction: 0.50
  operational_buffer_fraction: 0.10
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}

validation:
  scheme: one_fixed_adaptive_development_variant
  model_training: none
  number_of_variants: 1
  parameter_selection_after_outcome: forbidden
  same_2021_2025_period_is_not_independent: true
  forward_confirmation_required: true

promotion_rule:
  scope: challenger_for_new_forward_confirmation_only_never_live
  require_all:
    - every_parent_and_MOEX_RMS_identity_raw_replay_schema_and_temporal_check_true
    - at_least_one_OOS_positive_MR1_change_state
    - at_least_one_nonzero_parent_target_reduced_by_MR1_governor
    - zero_critical_failures_and_zero_unresolved_halts_in_all_scenarios
    - every_scenario_combined_CAGR_at_least_0_20
    - every_scenario_combined_MDD_not_worse_than_its_frozen_V27_reference
    - primary_combined_Sharpe_at_least_frozen_V27_primary
    - primary_combined_worst_year_not_worse_than_frozen_V27_primary
    - primary_positive_years_at_least_4_of_5
    - no_order_time_gross_participation_or_margin_breach
  independent_confirmation_required: true

forbidden_followups_on_same_outcomes:
  - changing_zero_boundary_or_seven_day_age
  - using_MR1_level_percentiles_magnitudes_smoothing_or_hysteresis
  - switching_to_MR2_MR3_LK1_LK2_after_result
  - changing_asset_mapping_or_global_versus_asset_specific_rule
  - inverting_the_rule_or_adding_aggressive_scale
  - changing_V27_signal_governors_leverage_collateral_execution_or_costs
  - treating_a_pass_as_independent_or_live_evidence

