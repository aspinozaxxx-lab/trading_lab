protocol_id: futures_v58_cftc_wti_positioning_br_v1
protocol_version: 1
status: sealed_after_cftc_source_audit_before_any_v58_br_outcome
declared_at_utc: '2026-09-02T18:45:00Z'
research_only: true
adaptive_same_history: true
live_trading_allowed: false

hypothesis: >-
  A persistent quarterly change in WTI managed-money net positioning reflects
  institutional commodity-flow continuation that should transfer directionally to
  MOEX Brent futures after the conservative CFTC publication lag.

independence:
  mechanism: official_external_positioning_flow_to_cross_benchmark_brent
  one_candidate_only: true
  no_parameter_sign_threshold_risk_or_asset_search: true
  no_use_as_v49_governor: true
  no_gold_signal_in_v58: true

