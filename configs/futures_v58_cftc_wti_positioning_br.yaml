signal:
  target_asset: BR
  cftc_market: WTI
  admitted_row: latest_available_at_or_before_decision_timestamp
  maximum_source_age_calendar_days: 14
  managed_money_net_share_formula: (managed_money_long-managed_money_short)/open_interest
  feature: current_net_share_minus_value_13_admitted_reports_ago
  lookback_admitted_reports: 13
  direction: positive_long_negative_short_exact_zero_cash
  thresholds: none
  decision_schedule: last_factual_BR_session_of_each_W_SUN_week
  decision_timestamp: 23_59_59_Europe_Moscow_after_completed_close

risk:
  BR_log_return_volatility_lookback_sessions: 20
  annualization_sessions: 252
  annual_volatility_target: 0.30
  maximum_absolute_target: 2.0
  unavailable_nonpositive_or_nonfinite_volatility_target: zero
  formula: sign_times_minimum_of_2_and_0_30_div_prior_20_session_annualized_log_volatility
  no_volatility_floor: true

baseline:
  always_cash: true
  price_only_63_session_trend:
    signal: sign_of_current_BR_close_div_BR_close_63_sessions_ago_minus_1
    exact_zero: cash
    schedule_risk_execution_costs: identical_to_cftc_candidate

execution:
  decision_to_fill: next_factual_effective_date_open
  active_contract: exact_BR_contract_known_at_decision
  roll: mandatory_old_exit_plus_new_entry_at_factual_open_when_nonzero_target
  integer_quantity: truncate_toward_zero
  initial_cash_rub: 1000000.0
  maximum_participation_of_prior_contract_volume: 0.01
  maximum_gross_notional_multiple: 2.0
  initial_margin_buffer_multiple: 2.0
  settlement_accounting: factual_variation_margin_with_open_gap_and_settlement_mark
  execution_atomicity: asset
  terminal_policy: carry_with_terminal_exit_cost_reserve
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}

promotion_gates:
  all_scenarios_execution_complete: true
  all_scenarios_cagr_gte: 0.20
  primary_sharpe_gte: 1.0
  all_scenarios_maximum_drawdown_lte: 0.30
  primary_positive_calendar_years_gte: 4
  aspirational_primary_cagr_gte: 0.50
  independent_unseen_confirmation_required: true
  live_promotion_forbidden: true

outputs:
  root: runs/v58_cftc_wti_positioning_br_v1
  immutable_timestamped_run: true
  required: [manifest.json, manifest.sha256, audit.json, metrics.json, report.md, signals.parquet, candidate_targets.parquet, baseline_targets.parquet, candidate_ledger_primary.parquet, baseline_ledger_primary.parquet]

limitations:
  - CFTC classifications may change and WTI is only a proxy for MOEX Brent.
  - Public daily MOEX OHLC cannot prove bid/ask, queue or exact opening fills.
  - Point value, fees and margin are conservative research proxies rather than broker-exact history.
  - The 2021-2025 period is adaptive development, not an independent holdout.
  - Historical evidence cannot guarantee profit or authorize live trading.
