hypothesis:
  statement: >-
    Two-times sealed V25 risk plus conservatively haircutted, causally available
    RUONIA on genuinely unencumbered collateral can retain at least 20 percent CAGR
    under all three fixed cost scenarios, while the causal cancel-and-clip admission
    policy removes V15 critical execution failures and keeps maximum drawdown within
    30 percent.
  economic_mechanism:
    - V25_removes_selected_above_average_financial_stress_weeks_before_leverage
    - futures_require_margin_rather_than_full_notional_funding
    - unused_collateral_can_earn_short_term_ruble_income
    - one_fixed_2x_multiplier_uses_existing_trend_edge_without_parameter_search
    - known_open_and_lagged_volume_capacity_is_enforced_before_order_submission
  primary_comparison: sealed_v25_stability_parent_and_failed_v15_capital_efficiency_parent
  reject_if:
    - any_input_identity_raw_replay_schema_temporal_availability_or_accrual_check_fails
    - sealed_weekly_STLFSI4_state_counts_do_not_match
    - any_critical_execution_failure_or_unresolved_halt_remains
    - any_primary_doubled_or_stress_combined_cagr_is_below_0_20
    - any_primary_doubled_or_stress_combined_maximum_drawdown_exceeds_0_30
    - primary_combined_sharpe_is_below_sealed_V25_primary
    - primary_combined_worst_year_is_below_minus_0_15
    - primary_combined_positive_years_are_below_4_of_5
    - any_order_time_gross_participation_or_margin_limit_is_breached
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_leverage_haircut_buffer_day_count_or_capacity_policy
    - reducing_the_2x_modeled_margin_buffer
    - changing_STLFSI4_zero_boundary_maximum_age_or_weekly_state
    - charging_interest_on_margin_or_negative_free_collateral
    - reinvesting_interest_into_contract_sizing_post_hoc
    - accepting_less_than_20_percent_after_observing_a_near_miss
    - treating_v26_as_independent_holdout_or_live_evidence

