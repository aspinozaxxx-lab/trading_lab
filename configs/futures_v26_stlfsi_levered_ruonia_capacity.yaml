relationship_to_prior_work: >-
  Adaptive same-period capital-efficiency hypothesis declared after V15 and V25
  outcomes were observed. V26 preserves the sealed V25 weekly STLFSI4-governed
  signal, doubles its governed target weights exactly once, adds the sealed V15
  conservative causal RUONIA collateral treatment, and uses the already-tested core
  ledger cancel-and-clip capacity policy. It does not use the invalidated V16 FUTOI
  signal and is not independent holdout confirmation.

