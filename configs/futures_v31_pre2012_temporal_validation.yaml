hypothesis:
  statement: >-
    Without any refit, equal exposure to absolute multi-horizon trend, causal curve-carry
    sign and cross-asset relative trend, followed by the frozen final 20-percent risk
    restoration capped at 2x, should retain at least 20-percent annualized return net of
    all three predeclared cost scenarios on the earlier unseen market regime.
  economic_mechanisms_inherited_byte_for_byte:
    - time_series_trend_captures_persistent_directional_risk_premia
    - curve_carry_captures_backwardation_or_contango_compensation
    - relative_trend_uses_simultaneous_cross_asset_information
    - final_risk_restoration_uses_quiet_state_capacity_but_never_exceeds_2x
  primary_comparison: frozen_V30_D2_development_metrics_and_unscaled_1x_on_same_unseen_period
  reject_if:
    - any_source_identity_causality_mask_or_execution_check_is_false
    - any_main_cost_scenario_CAGR_is_below_20_percent
    - any_main_cost_scenario_MDD_exceeds_30_percent
    - primary_or_stress_Sharpe_is_below_1
    - fewer_than_two_of_three_calendar_segments_are_positive
    - any_predeclared_robustness_gate_fails
  aspirational_50_percent_is_a_separate_reported_gate: true

