protocol_id: futures_v21_cbr_macro_revision_breadth_v1
protocol_version: 1
status: sealed_before_any_v21_market_outcome_read
declared_at_utc: "2026-09-01T02:45:00Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
relationship_to_prior_work: >-
  New current-vintage information family from the official Bank of Russia survey of
  analysts. The 2021-2025 market outcomes were seen in unrelated experiments and the
  workbook is an aggregated current snapshot without original release vintages; V21 is
  therefore development evidence and never independent holdout confirmation.

hypothesis:
  statement: >-
    Revisions in analysts' next-calendar-year median forecasts contain slow-moving
    information that can stabilize a multi-asset futures portfolio. A higher USD/RUB
    forecast is long SI, higher GDP growth is long RI and MIX, and a higher oil-price
    forecast is long BR; negative revisions take the symmetric direction.
  economic_mechanism:
    - usd_rub_expectation_maps_directly_to_SI
    - gdp_growth_expectation_maps_to_RI_and_MIX_risk_assets
    - oil_price_expectation_maps_directly_to_BR
    - independent_channels_keep_missing_information_from_becoming_a_composite_score
    - slow_expectations_persist_only_until_the_next_release_or_fixed_expiry
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_is_not_changed_or_combined_in_this_run
  reject_if:
    - any_source_identity_schema_or_temporal_check_fails
    - any_revision_uses_a_different_indicator_or_forecast_year
    - any_release_is_used_before_its_conservative_available_at
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - inverting_any_asset_sign
    - selecting_revision_magnitude_thresholds_or_weights
    - adding_CPI_key_rate_or_other_channels_based_on_v21_metrics
    - changing_oil_series_priority_or_bridging_different_oil_series
    - changing_risk_budgets_volatility_target_floor_or_expiry
    - changing_to_same_day_fill_or_earlier_release_availability
    - combining_with_V12_or_other_signals_based_on_v21_metrics
    - presenting_current_vintage_history_as_original_publication_vintages

dates:
  cbr_source_start: "2021-05-01"
  market_source_start: "2018-01-03"
  warmup_end: "2020-12-31"
  oos_start: "2021-01-01"
  oos_end: "2025-12-31"
  forbidden_from: "2026-01-01"
  source_timezone: Europe/Moscow
  market_timezone: Europe/Moscow

