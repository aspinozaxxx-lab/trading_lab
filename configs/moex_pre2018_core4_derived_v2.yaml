relationship_to_D1: >-
  D1 was committed and pushed before its only immutable source build. Its byte and
  temporal audits passed, but source-only roll diagnostics found that SI entered old
  illiquid serial-month contracts and then produced 9 unfilled rolls followed by 1276
  unfilled exits. No return, signal, strategy equity, or PnL was calculated or observed.
  D2 changes only structural contract admission before any strategy outcome: SI, RI and
  MIX use the official quarterly H/M/U/Z cycle and BR uses its official monthly cycle.
  Every roll/execution rule remains byte-identical to D1.

