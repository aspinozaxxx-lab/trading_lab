version: 1
sealed_before_return_analysis: true
protected_holdout_start: 2026-01-01
gdelt:
  endpoint: https://api.gdeltproject.org/api/v2/doc/doc
  modes:
    - timelinevolraw
    - timelinetone
  format: json
  timeline_smooth: 0
  availability_lag_calendar_days: 2
  channels:
    - id: ruble_attention
      query: (ruble OR rouble)
      rationale: Pryamoi potok novostei o ruble dlya valutnogo futures SI.
    - id: sanctions_russia
      query: Russia (sanction OR sanctions OR embargo)
      rationale: Sankcionnyi rezhim menyaet risk-premiyu RUB, akcii i eksport.
    - id: geopolitics_russia
      query: Russia (Ukraine OR war OR invasion OR ceasefire)
      rationale: Geopoliticheskii shok odnovremenno vozdeistvuet na SI, RI, MIX i BR.
    - id: oil_supply
      query: oil (OPEC OR supply OR production OR embargo)
      rationale: Fizicheskii i politicheskii neftyanoi risk dlya BR i rossiiskih indeksov.
    - id: gas_europe
      query: ("natural gas" OR LNG) (Russia OR Europe OR pipeline)
      rationale: Evropeiskii gazovyi kanal eksportnoi vyruchki i energeticheskogo riska.
    - id: russian_monetary
      query: Russia ("central bank" OR "interest rate" OR inflation)
      rationale: Ozhidaniya monetarnoi politiki dlya stavok, rublya i ocenki akcii.
    - id: russian_credit
      query: Russia (default OR debt OR liquidity OR bank)
      rationale: Kreditnyi stress i likvidnost' kak rezhimnyi indikator risk-off.
    - id: global_risk
      query: (recession OR "financial crisis" OR "risk aversion")
      rationale: Vneshnii risk-off faktor dlya indeksov, rublya i nefti.
cbr:
  conservative_non_ruonia_lag_calendar_days: 1
  series:
    - id: ruonia
      endpoint: https://www.cbr.ru/hd_base/ruonia/dynamics/
      availability_rule: publication_date_plus_one_calendar_day
    - id: key_rate
      endpoint: https://www.cbr.ru/DailyInfoWebServ/DailyInfo.asmx
      operation: KeyRateXML
      availability_rule: effective_date_plus_one_calendar_day
    - id: usd_rub_official
      endpoint: https://www.cbr.ru/scripts/XML_dynamic.asp
      val_nm_rq: R01235
      availability_rule: effective_date_plus_one_calendar_day
features:
  past_windows_days:
    - 7
    - 28
  minimum_history_days: 7
  gdelt_share_formula: article_count / norm
  surprise_formula: (share - trailing_28d_mean_shifted_1d) / trailing_28d_std_shifted_1d
  tone_change_formula: tone - trailing_7d_mean_shifted_1d
  cbr_rule: asof_join_only_when_available_at_is_not_after_decision_time
limitations:
  - GDELT historical timelines are current retrospective snapshots, not point-in-time archives.
  - GDELT coverage and machine-translated tone can be revised and have source-composition bias.
  - Key-rate and FX endpoints lack exact publication timestamps; one-day conservative lag is mandatory.
  - RUONIA publication date is used explicitly; a rate date is never treated as its availability date.
