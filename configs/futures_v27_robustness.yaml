    - protocol.sha256
    - bootstrap_samples.parquet
    - bootstrap_summary.csv
    - rolling_windows.parquet
    - leave_one_year_out.csv
    - deflated_sharpe.csv
    - report.md
    - metrics.json
    - identity.json

limitations:
  independent_holdout: false
  selected_same_history: true
  bootstrap_assumes_historical_blocks_are_representative: true
  bootstrap_frequencies_are_not_calibrated_probabilities: true
