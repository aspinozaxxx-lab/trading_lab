analysis:
  initial_cash_rub: 1000000.0
  annualization_sessions: 252
  metric_replay_absolute_tolerance: 1.0e-12
  calendar_years: [2021, 2022, 2023, 2024, 2025]
  rolling_window_sessions: 252
  rolling_windows_are_overlapping_descriptive_only: true
  bootstrap_method: circular_moving_block
  block_sessions: [5, 21, 63]
  bootstrap_replications_per_scenario_block: 20000
  bootstrap_batch_size: 250
  seed_base: 27000000
  seed_formula: seed_base_plus_scenario_index_times_10000_plus_block_sessions
  quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]
  bootstrap_horizon: exact_parent_session_count_and_elapsed_years
  bootstrap_threshold_cagr: [0.0, 0.20, 0.50]
  bootstrap_threshold_maximum_drawdown: 0.30
  deflated_sharpe_trial_counts: [27, 100]
  leave_one_year_out_clock: retained_observations_divided_by_252
  strategy_parameter_search: false

diagnostic_gates:
  scope: internal_robustness_support_for_unseen_validation_only
  minimum_20:
    minimum_stress_joint_20_30_frequency: 0.50
    minimum_stress_q05_cagr: 0.0
    stress_rolling_positive_fraction: 0.75
    every_stress_leave_one_year_out_cagr_above: 0.0
  aspirational_50:
    minimum_stress_joint_50_30_frequency: 0.50
  interpretation: >-
    Passing minimum_20 only says the selected historical path is not obviously fragile
    under these fixed diagnostics. Passing aspirational_50 would only be internal
    support, not a promise or independent estimate. Neither gate changes V27 or permits
    live trading.

forbidden_followups:
  - changing_V27_key_rate_or_STLFSI4_boundaries_from_audit_results
  - changing_leverage_RUONIA_buffer_capacity_costs_or_universe
  - selecting_a_bootstrap_block_length_after_results
  - reporting_resampling_frequency_as_a_calibrated_forward_probability
  - calling_same_history_robustness_an_independent_holdout
  - promoting_to_live_without_new_PIT_evidence_and_broker_exact_admission

reporting:
