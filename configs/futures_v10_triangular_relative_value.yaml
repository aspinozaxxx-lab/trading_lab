  initial_capital_rub: 1000000.0
  target_total_gross_fraction: 0.90
  equal_gross_budget_per_leg_fraction: 0.30
  maximum_total_gross_fraction: 1.0
  integer_contracts: true
  requested_contracts: floor_leg_budget_divided_by_causal_sizing_notional_capped_by_one_percent_signal_bar_volume
  entry_and_exit_realized_participation_limit: 0.01
  realized_capacity_failure: unresolved_no_fill_and_run_no_go
  zero_quantity_any_leg: skip_signal
  concurrent_baskets: 1
  collateral_interest: 0.0
  taxes: not_modeled

