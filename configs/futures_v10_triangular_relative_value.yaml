  distant_adverse_stop_absolute_z: 4.0
  maximum_holding_completed_bars: 18
  entry_decision_bar_end_local_inclusive: ['10:20:00', '14:30:00']
  one_open_basket_at_a_time: true
  direction_when_residual_high: {RI: short, MIX: long, SI: short}
  direction_when_residual_low: {RI: long, MIX: short, SI: long}
  exit_precedence: [distant_stop, take_profit, time_exit]

