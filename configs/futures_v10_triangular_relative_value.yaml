  gap_bridge: forbidden
  roll_bridge: forbidden
  partial_basket: forbidden
  missing_or_changed_leg: unresolved_no_fill_and_run_no_go
  entry_bar_can_trigger_exit_after_its_close: true
  no_overnight_intent: true

