universe:
  assets: [GAZR, SBRF, ROSN, TATN, NOTK]
  shares_per_contract: 100
  direction: long_stock_short_one_futures
  naked_stock_short_or_futures_long: forbidden
  positions_per_asset: 1
  portfolio_sleeves_equal_weight: 0.20

decision:
  timezone: Europe/Moscow
  one_decision_candle_begin_per_day: '15:40:00'
  decision_available_at_candle_end: true
  execution: next_exactly_aligned_10m_candle_open
  expected_execution_candle_begin: '15:50:00'
  same_candle_fill: forbidden
  spot_and_futures_timestamp_must_match_exactly: true
  both_candles_positive_volume_required: true
  eligible_calendar_days_to_last_trade: {minimum: 30, maximum: 90}
  contract_choice: nearest_last_trade_then_lexicographic_secid
  scheduled_exit_calendar_days_to_last_trade: 5
  hold_to_scheduled_exit_without_signal_tuning: true

point_in_time_cashflow:
  latest_available_snapshot_per_asset_and_event_date: true
  required_available_at_lte_decision_at: true
  event_date_t_must_be_after_entry_and_lte_last_trade_minus_5_days: true
  projected_cashflow_haircut: 0.50
  missing_cashflow: zero_for_signal_and_explicitly_counted
  outcome_proxy: latest_RMS_value_available_by_exit_for_events_that_occurred_while_held
  outcome_is_not_proof_of_actual_shareholder_payment: true

entry_gate:
  formula: >-
    annualized locked proxy = (futures lot price + 100 * 0.5 * PIT cashflows
    - 100 * spot price - ordinary round-trip costs) / conservative capital
    * 365 / calendar days to scheduled exit
  threshold: max_20pct_or_ruonia_plus_4pct
  ruonia_required_and_point_in_time: true
  no_entry_on_missing_ruonia: true

capital:
  stock_notional: 100_times_spot_price
  futures_margin_reserve_fraction_of_futures_notional: 0.30
  conservative_capital: stock_notional_plus_margin_reserve
  borrowing: none_fully_funded
  integer_unit_trade: one_futures_and_100_shares

costs:
  ordinary:
    spot_bps_per_side: 10.0
    futures_bps_per_side: 5.0
  doubled:
    spot_bps_per_side: 20.0
    futures_bps_per_side: 10.0
  costs_include_commission_slippage_and_unobserved_spread_proxy: true

scenarios:
  primary: {cashflow_credit_fraction: 0.50, cost_model: ordinary}
  doubled: {cashflow_credit_fraction: 0.50, cost_model: doubled}
  zero_cashflow_stress: {cashflow_credit_fraction: 0.00, cost_model: doubled}
  full_rms_proxy_upper_bound: {cashflow_credit_fraction: 1.00, cost_model: ordinary}
  identical_decisions_across_scenarios: true

outputs:
  root: runs/stock_futures_cash_carry_intraday_v1
  immutable_timestamped_run: true
  required: [manifest.json, manifest.sha256, audit.json, metrics.json, report.md, decisions.parquet, trades.parquet, daily_ledger.parquet]

quality_gates:
  exact_source_hashes: true
  all_rows_before_2026: true
  exact_timestamp_alignment: true
  no_overlapping_position_within_asset: true
  next_bar_fill_only: true
  report_decisions_signals_trades_unresolved_and_years: true
  report_CAGR_Sharpe_MDD_and_primary_doubled_zero_cashflow: true
  raw_RMS_proxy_never_called_realized_dividend: true

promotion:
  historical_screen_can_only_be_NO_GO_or_FORWARD_CANDIDATE: true
  forward_candidate_requires_primary_and_doubled_positive_CAGR: true
  forward_candidate_requires_primary_Sharpe_gte: 1.0
  forward_candidate_requires_primary_MDD_lte: 0.15
  forward_candidate_requires_trades_gte: 20
  forward_candidate_requires_positive_years_gte: 2
  live_promotion_forbidden: true

limitations:
  - RMS cashflow values are risk-system projections, not verified paid dividends.
  - MOEX candles have no bid/ask, order queue, aggressor side, or broker rejects.
  - Current-vintage contract specs and ISS history may have been revised.
  - Equal-weight sleeve normalization ignores investor-specific integer capital constraints.
  - Historical results cannot guarantee profit or authorize live trading.
