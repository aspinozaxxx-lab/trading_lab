protocol_id: stock_futures_cash_carry_intraday_v1
protocol_version: 1
status: sealed_before_any_stock_futures_basis_signal_return_or_pnl
declared_at_utc: '2026-09-02T04:00:00Z'
research_only: true
live_trading_allowed: false

hypothesis: >-
  A fully funded covered position (long 100 shares, short one same-underlying
  deliverable futures contract) can lock an unusually rich forward premium with
  lower directional risk. Trade only when a 50%-haircut point-in-time MOEX RMS
  cashflow estimate still clears both 20% annualized and RUONIA plus 4%.

evaluation:
  start: '2023-01-01'
  end: '2025-12-31'
  protected_from: '2026-01-01'
  parameter_fitting: none
  interpretation: sealed_historical_current_vintage_screen_not_independent_live_holdout

sources:
  intraday:
