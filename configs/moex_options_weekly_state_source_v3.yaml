protocol_id: moex_options_weekly_state_source_v3
protocol_version: 3
status: sealed_after_public_january_pilot_before_nonpilot_weekly_values
declared_at_utc: '2026-09-02T02:28:00Z'
scope: source_only_no_strategy_no_returns_no_pnl
research_only: true
live_trading_allowed: false

parent_source:
  protocol_id: moex_options_surface_source_v2
  config_sha256: 685fb7e9ee5776cfc21dee3c3946ce3e63050c54ec0de02918d98d953308c14a
  canonical_manifest_sha256: 0211e452fb60ea895b3992844f22060d908b05e01e0c30526f9e0fbfb57784c6
  january_2021_values_already_read: true
  disclosed_diagnostics_already_read:
    total_rows: 105318
    positive_trade_rows: 7887
    positive_open_interest_rows: 17215
    theor_price_nonmissing_rows: 0
    open_interest_put_call_aggregation_feasible_in_pilot: true
  non_january_2021_2025_values_read_before_this_seal: false

objective:
  statement: >-
    Build an immutable target-free weekly panel of official MOEX option EOD states on
    the exact frozen V27 weekly decision calendar. The panel may later support a
    separately sealed option-state governor whose orders execute only in futures.
  source_only: true
  signal_returns_targets_predictions_or_pnl_allowed: false
  economic_rule_fixed_by_this_protocol: false

decision_calendar:
  artifact: runs/v27_key_rate_governor_20260901T052350Z_7a9a44cf/weekly_v27_monetary_governed_weights.parquet
  sha256: 576b2b9d951c6f80895d609aff5e5dbf327472290a946078ee0afdc353110df8
  permitted_column: decision_date
  all_other_columns_forbidden: true
  start: '2021-01-01'
  end: '2025-12-31'
  expected_unique_dates: 261
  expected_first_date: '2021-01-08'
  expected_last_date: '2025-12-30'
  query_exact_decision_dates: true
  downstream_same_date_join_forbidden: true

source:
  provider: Moscow_Exchange_MOEX_ISS
  official_interface: https://www.moex.com/a8531
  endpoint: https://iss.moex.com/iss/history/engines/futures/markets/options/securities.json
  access_mode: public_delayed_exact_date_history
  bearer_token_required: false
  date_parameter: date
  asset_parameter: assetcode
  assets: [Si, RTS, BR, MIX]
  logical_mapping: {Si: SI, RTS: RI, BR: BR, MIX: MIX}
  cursor_block: history.cursor
  data_block: history
  pagination_start_parameter: start
  fixed_page_size: 100
  required_columns:
    - TRADEDATE
    - BOARDID
    - SECID
    - OPEN
    - LOW
    - HIGH
    - CLOSE
    - OPENPOSITIONVALUE
    - VALUE
    - VOLUME
    - OPENPOSITION
    - SETTLEPRICE
    - WAPRICE
    - CHANGE
    - QTY
    - NUMTRADES
    - THEOR_PRICE
  raw_response_bytes_url_hash_and_retrieval_required: true

selection:
  short_code_roots: [RI, MX, SI, BR]
  root_mapping: {RI: RI, MX: MIX, SI: SI, BR: BR}
  parser_implementation: market_lab.futures.moex_options_surface_source.parse_option_short_code
  server_asset_and_parsed_root_must_match: true
  exact_expiry_day_inference: forbidden
  no_strike_maturity_side_or_activity_filter: true

temporal_semantics:
  source_date: final_trading_results_date
  conservative_available_at: next_calendar_date_00_00_Europe_Moscow
  admissible_future_join: source_date_strictly_before_decision_date
  same_day_signal_allowed: false
  historical_final_archive: true
  original_revision_vintage_proved: false

quality_gates:
  decision_calendar_hash_and_count_exact: true
  all_1044_asset_date_jobs_present: true
  exact_required_schema: true
  cursor_total_complete_for_every_asset_date: true
  parsed_core_rows_positive_overall: true
  core_prefixed_unparsed_zero: true
  duplicate_date_board_security_zero: true
  server_asset_and_parsed_asset_exact: true
  protected_rows_zero: true
  raw_pages_replay_exact: true
  source_and_processed_hashes_exact: true
  no_returns_targets_predictions_or_pnl: true
  immutable_output: true

limitations:
  historical_bid_ask_or_order_book_available: false
  theor_price_is_not_tradable_quote: true
  settleprice_is_not_order_time_fill: true
  exact_expiry_day_not_proved: true
  economic_interpretation_of_open_interest_not_fixed: true
  source_cannot_support_historical_option_execution_or_live_claim: true

output:
  directory: data/processed/options/moex-core4-options-weekly-2021-2025-v3
  immutable: true
  contents_in_git: false

forbidden_after_collection:
  - computing_strategy_returns_or_pnl_before_a_separate_pushed_economic_protocol
  - using_same_date_option_state_at_the_frozen_decision
  - selecting_strikes_maturities_days_assets_sides_or_thresholds_by_future_returns
  - treating_THEOR_PRICE_or_SETTLEPRICE_as_observed_bid_or_ask
  - overwriting_the_source_output
  - live_trading_or_profit_guarantees

forbidden_columns: [return, returns, label, target, prediction, pnl, profit, equity]
