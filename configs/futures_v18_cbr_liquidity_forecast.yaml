protocol_id: futures_v18_cbr_liquidity_forecast_v1
protocol_version: 1
status: sealed_before_any_v18_market_outcome_read
declared_at_utc: "2026-09-01T00:02:50Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
relationship_to_prior_work: >-
  New release-keyed, forward-looking Bank of Russia liquidity forecasts. The SI market
  outcomes for 2021-2025 have been seen in prior unrelated experiments, so a positive
  V18 result is development evidence and not an independent holdout.

hypothesis:
  statement: >-
    The sign of the Bank of Russia forecast for the coming-period change in general
    government accounts and other items predicts SI futures direction: a positive
    liquidity contribution pressures the ruble and is long SI, while a negative
    contribution supports the ruble and is short SI.
  economic_mechanism:
    - positive_government_account_factor_means_ruble_liquidity_enters_the_banking_system
    - the_official_definition_includes_Ministry_of_Finance_domestic_FX_operations
    - additional_ruble_liquidity_and_FX_purchases_can_raise_the_ruble_price_of_foreign_currency
    - the_forecast_is_published_before_the_future_period_not_after_realized_market_outcomes
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_is_not_changed_or_combined_in_this_run
  reject_if:
    - any_source_identity_or_temporal_check_fails
    - any_required_government_forecast_value_is_missing
    - a_position_is_carried_beyond_the_printed_forecast_period_without_a_new_release
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - inverting_the_economic_sign
    - replacing_government_accounts_with_another_row_or_composite
    - adding_a_magnitude_threshold_or_selecting_only_extreme_forecasts
    - changing_the_information_lag_or_expiry_rule
    - changing_volatility_target_lookback_floor_or_gross_cap
    - selecting_holding_period_or_costs_by_v18_metrics
    - presenting_this_development_result_as_independent_confirmation

