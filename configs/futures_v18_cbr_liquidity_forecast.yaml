information_set:
  source_availability: 23:59:59_Europe_Moscow_on_the_date_printed_inside_the_release_record
  query_date_is_not_evidence: true
  release_join: available_at_must_be_less_than_or_equal_to_decision_at
  decision_at: end_of_first_factual_MOEX_decision_session_on_or_after_local_available_date
  execution_not_before: exact_active_contract_open_on_next_factual_effective_date
  release_must_not_be_expired_at_decision: true
  missing_week_policy: flatten_after_prior_printed_forecast_period_end
  last_modified_forbidden_for_timing: true
  future_columns_forbidden: [open_D_plus_1, return_D_plus_1, target, label, pnl]
  no_zero_imputation: true
  no_gap_or_roll_return_bridge: true

signal:
  id: cbr_government_accounts_forward_liquidity_direction
  value: government_accounts_change_bln_rub_from_that_dated_forecast
  economic_sign_to_SI: 1
  direction: sign_of_value_with_exact_zero_flat
  normalization: none
  trade_threshold: none
  fit_or_outcome_training: none
  hyperparameter_search: false
  validity_start: printed_forecast_period_start
  validity_end: printed_forecast_period_end
  state_between_releases: carry_only_while_the_latest_printed_period_remains_valid
  expiry_without_successor: zero_target_at_end_of_printed_period

portfolio:
  universe_exact_order: [SI, RI, BR, MIX]
  non_SI_targets: zero
  SI_daily_volatility_lookback_sessions: 60
  annualization_sessions: 252
  annualized_volatility_floor: 0.10
  annual_target_volatility: 0.20
  SI_absolute_weight_cap: 1.0
  target_formula: direction_times_min_1_and_0_20_divided_by_max_prior_60d_vol_and_0_10
  mandatory_additional_decisions: any_known_SI_contract_change_for_nonzero_held_target
  gross_cap: 1.0

execution:
  initial_cash_rub: 1000000.0
  decision_to_fill: next_factual_effective_date_open
  integer_quantity: truncate_toward_zero_weight_times_current_cash_over_lagged_notional
  active_contract: exact_contract_known_at_decision_from_active_contract_map
  roll: explicit_old_exit_plus_new_entry_at_same_factual_open
  execution_atomicity: asset
  maximum_participation: 0.01
  participation_denominator: immediately_prior_factual_contract_volume
  maximum_gross_notional_multiple: 1.0
  initial_margin: modeled_25_percent_of_lagged_notional
  initial_margin_buffer_multiple: 2.0
  settlement_accounting: factual_variation_margin_with_open_gap_and_settlement_mark
  collateral_yield: 0.0
  terminal_policy: carry_with_terminal_exit_reserve_reported
  missing_or_unprovable: reject_or_unresolved_never_zero_return
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}
  limitations:
    historical_exchange_exact: false
    broker_exact: false
    queue_and_bid_ask_exact: false
    point_value_fee_and_margin: frozen_conservative_research_proxy
    cbr_original_release_bytes_at_publication: unavailable
    cbr_historical_record_immutability: not_cryptographically_proved

validation:
  scheme: fixed_development_OOS_after_market_warmup
  source_history: "2017-01-10..decision_release_inclusive"
  market_warmup: "2018-01-03..2020-12-31"
  oos: "2021-01-01..2025-12-31"
  model_training: none
  parameter_selection_on_oos: forbidden
  protected_2026_price_or_outcome_read: forbidden

promotion_rule:
  scope: go_to_new_unseen_validation_only_never_live
  require_all:
    - every_input_and_temporal_check_true
    - at_least_245_release_decisions_and_45_each_oos_year
    - all_three_scenarios_execution_complete
    - zero_critical_failures_and_zero_unresolved_halts
    - primary_cagr_at_least_0_05
    - primary_sharpe_at_least_0_75
    - primary_maximum_drawdown_at_most_0_20
    - primary_positive_years_at_least_4_of_5
    - doubled_total_return_positive
    - stress_total_return_positive
    - no_gross_participation_or_margin_breach
  independent_confirmation_required: true

reporting:
  required_artifacts:
    - resolved_protocol.yaml
    - identity.json
    - source_forecasts.parquet
    - source_decisions.parquet
    - mapped_targets.parquet
    - decision_audit.csv
    - coverage.csv
    - ledger_primary.parquet
    - orders_primary.parquet
    - positions_primary.parquet
    - ledger_doubled.parquet
    - orders_doubled.parquet
    - positions_doubled.parquet
    - ledger_stress.parquet
    - orders_stress.parquet
    - positions_stress.parquet
    - metrics.json
    - report.md
