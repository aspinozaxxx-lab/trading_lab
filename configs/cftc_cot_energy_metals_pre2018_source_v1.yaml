temporal_semantics:
  conservative_available_at: report_date_plus_7_calendar_days_at_23_59_59_America_New_York
  same_report_week_use_forbidden: true
  no_backfill_to_earlier_decision: true

frozen_later_v59_hypothesis:
  economic_statement: >-
    A quarterly increase in WTI managed-money net share represents crowded speculative
    positioning and future hedger pressure, so MOEX Brent should be held in the opposite
    direction after the conservative publication lag.
  target_asset: BR
  primary_feature: current_WTI_managed_money_net_share_minus_value_13_admitted_reports_ago
  direction_rule: positive_short_BR_negative_long_BR_exact_zero_cash
  lookback_admitted_reports: 13
  evaluation: independent_pre2018_2013_through_2017_after_2012_warmup
  decision_schedule: last_factual_MOEX_session_of_W_SUN_week
  CFTC_row_must_have_available_at_lte_decision: true
  maximum_source_age_calendar_days: 14
  execution: factual_next_BR_open_same_contract_with_exact_rolls
  BR_log_volatility_lookback_sessions: 20
  annual_volatility_target: 0.30
  maximum_absolute_target: 2.0
  baseline: BR_price_only_63_session_trend_same_risk_execution
  cost_scenarios_ticks_and_fee_multipliers:
    primary: [1, 1]
    doubled: [2, 2]
    stress: [4, 2]
  minimum_all_scenario_CAGR: 0.20
  primary_sharpe_gte: 1.0
  maximum_all_scenario_MDD: 0.30
  minimum_primary_positive_years: 4
  no_change_after_2012_2017_source_values_or_BR_outcomes: true

outputs:
  root: data/processed/info_radar/cftc-cot-energy-metals-2012-2017-v1
  immutable: true

limitations:
  - Reverse-chronology validation is independent in time but the hypothesis was inspired by V58.
  - WTI positioning is a proxy for MOEX Brent and classifications can change.
  - Historical evidence cannot guarantee profit or authorize live trading.
