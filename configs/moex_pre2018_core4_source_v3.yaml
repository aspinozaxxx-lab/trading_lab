contract_metadata:
  endpoint_template: https://iss.moex.com/iss/securities/{secid}.json
  description_columns: [name, value]
  required_description_fields: [SECID, SHORTNAME, FRSTTRADE, LSTDELDATE]
  optional_description_fields: [LSTTRADE]
  boards_columns:
    - secid
    - boardid
    - history_from
    - history_till
    - listed_from
    - listed_till
    - is_primary
    - is_traded
    - engine
    - market
  expiration_identity: LSTDELDATE
  request_end_identity: LSTDELDATE
  missing_LSTTRADE_policy: preserve_as_missing_never_infer_from_prices
  require_every_contract: true

metadata_audit_record:
  exact_contracts: 155
  FRSTTRADE_present: 155
  LSTDELDATE_present: 155
  LSTTRADE_present: 91
  LSTTRADE_missing: 64
  exact_one_overlapping_RFUD_segment: 155
  daily_price_endpoint_reached_before_v3_seal: false
  output_bundle_created_before_v3_seal: false
  returns_targets_labels_equity_or_pnl_observed: false

forbidden_v3_changes:
  - source_dates
  - exact_expected_contract_names_or_counts
  - FRSTTRADE_or_LSTDELDATE_requirements
  - RFUD_board_requirement
  - daily_price_columns_or_cursor_contract
  - missing_gap_roll_or_zero_imputation_policy
  - output_or_live_limitations
