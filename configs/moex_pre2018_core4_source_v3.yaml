relationship_to_prior_work: >-
  V2 corrected only lowercase security-finder query names and then discovered all 155
  exact contracts. Its collection attempt stopped during contract metadata, before any
  daily price response, because old MOEX descriptions omit LSTTRADE for some contracts.
  A metadata-only audit of all 155 exact aliases found FRSTTRADE and LSTDELDATE for every
  contract, LSTTRADE for 91 and missing LSTTRADE for 64, plus exactly one overlapping
  dated RFUD segment for every contract. V3 preserves every V1 source rule and the V2
  lowercase finder fix. It makes LSTTRADE optional and preserves it as missing; required
  LSTDELDATE remains the exact expiration and daily request-end identity.

