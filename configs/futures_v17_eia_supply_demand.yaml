protocol_id: futures_v17_eia_supply_demand_v1
protocol_version: 1
status: sealed_before_any_v17_market_outcome_read
declared_at_utc: "2026-08-31T23:34:19Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
relationship_to_prior_work: >-
  New target-free physical-balance information from release-specific EIA vintages. The
  BR market outcomes for 2021-2025 have been seen in prior unrelated experiments, so a
  positive V17 result is development evidence and not an independent holdout.

hypothesis:
  statement: >-
    A causal composite of unexpected weekly U.S. petroleum supply, inventory, refinery
    demand and product demand changes predicts the direction of the next-week BR futures
    return after the first post-release MOEX session, and can earn positive net PnL with
    volatility scaling and exact next-open execution.
  economic_mechanism:
    - inventory_builds_and_additional_supply_are_bearish_for_crude
    - refinery_inputs_and_products_supplied_proxy_physical_demand
    - physical_balance_repricing_can_persist_beyond_the_initial_release_session
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_is_not_changed_or_combined_in_this_run
  reject_if:
    - any_source_identity_or_temporal_check_fails
    - any_selected_component_is_missing_at_an_eligible_release
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_components_or_economic_signs
    - changing_normalization_window_clip_or_minimum_history
    - adding_a_trade_threshold_or_selecting_only_extreme_releases
    - changing_volatility_target_lookback_or_gross_cap
    - shortening_the_information_lag_after_observing_results
    - selecting_holding_period_or_costs_by_v17_metrics
    - presenting_this_development_result_as_independent_confirmation

