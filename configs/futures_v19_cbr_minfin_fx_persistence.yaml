protocol_id: futures_v19_cbr_minfin_fx_persistence_v1
protocol_version: 1
status: sealed_before_any_v19_market_outcome_read
declared_at_utc: "2026-09-01T00:35:39Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
relationship_to_prior_work: >-
  New current-vintage source values: realized Ministry of Finance domestic FX operations
  reported by the Bank of Russia. The 2021-2025 SI outcomes were seen in prior unrelated
  experiments and the historical source can be revised, so any V19 result is development
  evidence rather than an independent holdout or original-vintage confirmation.

hypothesis:
  statement: >-
    The reported sign of Ministry of Finance domestic FX operations persists into the
    next executable SI session: a foreign-currency purchase creates demand for foreign
    currency and is long SI, while a sale creates supply and is short SI.
  economic_mechanism:
    - positive_source_sign_is_an_officially_defined_foreign_currency_purchase
    - negative_source_sign_is_an_officially_defined_foreign_currency_sale
    - budget_rule_operations_are_programmatic_and_can_persist_across_working_days
    - the_observation_day_itself_is_never_traded_from_its_later_publication
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_is_not_changed_or_combined_in_this_run
  reject_if:
    - any_source_identity_or_temporal_check_fails
    - any_required_Minfin_FX_value_is_missing
    - a_source_row_is_used_before_10_31_Moscow_on_its_inferred_publication_day
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - inverting_the_economic_sign
    - replacing_Minfin_FX_operations_with_another_liquidity_factor_or_composite
    - adding_a_magnitude_threshold_or_scaling_by_the_reported_amount
    - smoothing_rolling_or_selecting_only_program_change_days
    - changing_the_information_lag_or_same_session_decision_rule
    - changing_volatility_target_lookback_floor_or_gross_cap
    - combining_with_V12_V18_or_other_signals_based_on_V19_metrics
    - selecting_holding_period_or_costs_by_v19_metrics
    - presenting_current_vintage_history_as_original_publication_vintages

