hypothesis: >-
  A causal medium-horizon trend in the RGBI government-bond futures, scaled to a fixed
  volatility target and executed at the next factual open, can provide an independent
  rates return engine with at least twenty percent CAGR under cost stress and a
  primary path toward the thirty-five to fifty percent region.

