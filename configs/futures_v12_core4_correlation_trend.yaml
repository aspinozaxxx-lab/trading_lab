protocol_id: futures_v12_core4_correlation_trend_v1
protocol_version: 1
status: predeclared_before_v12_oos_outcomes
declared_at_utc: "2026-08-31T18:03:50Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
relationship_to_prior_work: >-
  Adaptive same-period hypothesis generation after V5-V11 and the broad V9 structural
  proxy were observed. A positive 2021-2025 result is not an independent confirmation
  and requires new unseen history before any admission decision.

hypothesis:
  statement: >-
    Persistent multi-horizon trends in BR, MIX, RI and SI can produce positive net
    variation-margin PnL when all four markets are sized jointly with a causal covariance
    risk model and executed at the next factual open using integer contracts.
  economic_mechanism:
    - slow_information_diffusion_and_hedger_pressure_create_trend_persistence
    - cross_asset_covariance_downscaling_reduces_duplicate_RI_MIX_risk
    - five_rebalance_sleeves_reduce_turnover_without_using_future_outcomes
  primary_comparison: flat_cash_zero_return
  reject_if:
    - any_required_input_identity_or_temporal_check_fails
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_momentum_horizons_or_clip
    - changing_rebalance_frequency_or_sleeve_count
    - changing_target_volatility_gross_or_participation_caps
    - selecting_assets_or_cost_model_by_observed_v12_metrics
    - treating_this_development_result_as_independent_holdout

dates:
  source_start: "2018-01-03"
  warmup_end: "2020-12-31"
  oos_start: "2021-01-01"
  oos_end: "2025-12-31"
  forbidden_from: "2026-01-01"
  timezone: Europe/Moscow

