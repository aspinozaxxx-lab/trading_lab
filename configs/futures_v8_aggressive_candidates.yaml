  execution_price: adverse_high_for_buy_low_for_sell_of_factual_window
  no_fill_or_incomplete_window: carry_and_record_not_hindsight_cash_filter
  stateful_identity: candidate_sleeve_asset_contract_order_execution_evidence
  state_advance: factual_full_fill_only
  partial_fill: retain_exposure_and_mark_carry_unresolved

