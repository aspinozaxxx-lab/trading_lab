causality:
  decision_timezone: Europe/Moscow
  decision_local_time: '18:50:00'
  development_universe: [BR, MIX, RI, SI]
  full_universe_required: true
  allowed_inputs:
    - sealed_v8_prediction_outputs
    - causal_raw_10m_interval_previous_d18_50_exclusive_to_d18_50_inclusive
    - d_known_active_contract_and_forward_additive_adjustment
    - point_in_time_cftc
    - point_in_time_cbr
    - d_known_carry
  later_10m_use: state_transition_after_factual_bar_close_only
  expected_bar_sequence: exact_exchange_calendar_sequence_or_carry_unresolved
  point_in_time_provenance: published_at_source_id_observation_id_source_sha256
  input_bundle_sha256: canonical_hash_of_all_prediction_market_and_pit_values
  model_input_valid: base_prediction_asset_valid_and_finite_outputs
  decision_market_valid: exact_raw_close_and_all_causal_market_features
  planned_contract_valid: nominal_calendar_14d_conservative_proxy
  strategy_eligible: model_input_valid_and_decision_market_valid_and_planned_contract_valid
  invalid_cross_section: exclude_before_rank_demean_normalize_or_state_transition
  invalid_stateful_position: carry_only_locked_factual_contracts_no_target_or_order_intent
  raw_close: exact_active_contract_18_40_to_18_50_msk_bar_no_stale_fallback
  signal_chain: causal_forward_additive_economic_asset_chain_across_rolls_no_reset
  daily_price_features: raw_10m_derived_ohlc_atr20_momentum20_daily_vol20_range20_no_panel_fallback
  final_daily_panel: qa_only_never_strategy_input_or_mask_or_hash
  intraday_ratio_coverage: current_and_prior20_each_at_least_48_of_53_scheduled_buckets
  intraday_raw_end_rule: raw_end_at_lte_scheduled_close_lte_decision
  nominal_span_rule: calendar_14d_conservative_proxy_not_exact_five_session_proof
  evaluation_exit_observable: separate_d_i_to_d_i_plus_5_calendar_mask_never_strategy_input
  missing_input: optional_none_never_impute
  entry_execution: futures-v8-completed-window-pov-v2
  future_entry_selection: forbidden
  protected_holdout_start: 2026-01-01
  protected_holdout_access: forbidden_before_all_fixed_development_gates_pass

portfolio_handoff:
  maximum_gross_exposure: 1.0
  leverage_above_one: false
  holding_sleeve_count: 5
  sleeve_weight: 0.20
  minimum_trade_delta_contracts: 1
  integer_contract_rounding: truncate_toward_zero_after_allocation
