  corridor_exit_outcome: CandidateExitExecutionEvidence
  breakout_signal_intent: BreakoutAssetIntent
  breakout_unresolved_fill: BreakoutUnresolvedExecution
  breakout_locked_position: BreakoutLockedPosition
  direct_price_or_quantity_injection: forbidden

candidates:
  - id: volatility_corridor_harvest
    family: stateful_intraday_range_harvest
    thesis: volatile_range_mean_reversion_with_near_profit_and_distant_fixed_stop
    inputs: [v8_predictions, d_known_daily, factual_later_10m]
    volatility_ratio_minimum: 1.15
    lower_range_position_maximum: 0.20
    upper_range_position_minimum: 0.80
    residual_score_minimum: 0.15
    crash_probability_maximum: 0.35
    maximum_assets: 2
    take_profit_atr: 0.80
    stop_loss_atr: 2.80
    bracket_reference: atr_20_known_at_decision
    bracket_activation: only_after_factual_v8_entry_fill
    entry_api: linked_candidate_decision_plus_scheduled_execution_evidence_only
    monitor: chronological_factual_10m_bars_after_entry
    missing_expected_monitor_bar: carry_unresolved
    maximum_holding: scheduled_fifth_common_session_execution_window
    no_touch_scheduled_exit: adverse_low_for_long_high_for_short_of_exact_exit_window
    missing_scheduled_exit_window: carry_unresolved_no_synthetic_price
    same_bar_take_profit_and_stop: adverse_stop_first
    stop_gap_fill: worse_of_bar_open_and_predeclared_stop
    trigger_result: exit_intent_only
    closed_state: factual_capacity_bounded_exit_evidence_only
    exit_participation_maximum_bps: 100

  - id: concentrated_residual_dispersion
    family: cross_asset_residual
    thesis: concentrate_on_one_strongest_long_and_one_strongest_short_residual
    inputs: [v8_predictions, d_known_daily]
    leg_count_each_side: 1
    score_spread_minimum: 0.45
    absolute_score_minimum: 0.20
    abstain_probability_maximum: 0.50
    long_gross: 0.50
    short_gross: 0.50

  - id: breakout_pyramiding_trailing_stop
    family: stateful_trend
    thesis: add_only_after_repeated_confirmed_breakout_and_exit_on_causal_atr_trail
    inputs: [v8_predictions, d_known_daily, d_known_completed_10m]
    trend_probability_minimum: 0.50
    residual_score_minimum: 0.25
    volatility_ratio_minimum: 1.10
    breakout_long_range_position_minimum: 1.0
    breakout_short_range_position_maximum: 0.0
    pyramid_levels: 3
    pyramid_level_fractions: [0.3333333333333333, 0.6666666666666666, 1.0]
    pyramid_fraction_scope: aggregate_candidate_gross_after_cross_asset_base_allocation
    level_advance: only_after_factual_full_fill_no_carry
    partial_or_zero_fill: keep_prior_level_and_mark_unresolved
    opposite_signal_with_open_state: exit_first_reversal_entry_only_after_full_exit
    trailing_stop_atr: 2.00
    trailing_extreme: monotone_max_for_long_min_for_short

  - id: regime_switch_trend_reversion
    family: regime_switch
    thesis: trend_follow_in_trend_expert_and_range_fade_in_normal_expert
    inputs: [v8_predictions, d_known_daily]
    trend_probability_minimum: 0.55
    normal_probability_minimum: 0.55
    residual_score_minimum: 0.15
    lower_range_position_maximum: 0.20
    upper_range_position_minimum: 0.80
    allocation: inverse_ex_ante_daily_volatility_then_gross_normalize

  - id: crash_expert_convex_defense
    family: crash_defense
    thesis: reverse_common_factor_and_increase_defense_as_crash_probability_rises
    inputs: [v8_predictions, d_known_daily]
    crash_probability_minimum: 0.40
    factor_score_minimum: 0.20
    exposure_ramp: linear_from_zero_at_0_40_to_one_at_1_00
    direction: opposite_sign_of_cross_asset_mean_factor_score
    allocation: inverse_ex_ante_daily_volatility
    options_or_synthetic_convexity_claim: false

  - id: carry_momentum_confirmation
    family: carry_trend
    thesis: require_carry_momentum_and_model_residual_to_agree
    inputs: [v8_predictions, d_known_daily, carry]
    carry_z_minimum: 0.40
    momentum_20_minimum_in_direction: 0.01
    residual_score_minimum_in_direction: 0.15
    allocation: absolute_carry_z_over_ex_ante_daily_volatility

  - id: cftc_crowded_unwind
    family: positioning_reversal
    thesis: fade_extreme_positioning_only_after_price_reversal_against_crowd
    inputs: [v8_predictions, d_known_daily, point_in_time_cftc]
    cftc_crowd_z_minimum: 1.50
    reversal_momentum_minimum: 0.005
    direction: opposite_sign_of_crowd
    missing_cftc: cash
    allocation: absolute_crowd_z_over_ex_ante_daily_volatility

  - id: macro_shock_rotation
    family: macro_event
    thesis: rotate_across_moex_futures_on_point_in_time_rate_and_fx_shocks
    inputs: [v8_predictions, d_known_daily, point_in_time_cbr]
    rate_shock_z_minimum: 1.50
    fx_shock_z_minimum: 1.50
    rate_sensitivities: {RI: -1.0, MIX: -1.0, SI: 0.35, BR: 0.0}
    fx_sensitivities: {SI: 1.0, BR: 0.50, RI: -0.50, MIX: -0.35}
    missing_macro_channel: zero_contribution
    allocation: summed_shock_sensitivity_over_ex_ante_daily_volatility

  - id: confidence_concentration
    family: uncertainty_concentration
    thesis: deploy_full_gross_only_to_highest_residual_signal_to_noise_asset
    inputs: [v8_predictions, d_known_daily]
    residual_snr_minimum: 1.75
    abstain_probability_maximum: 0.25
    maximum_assets: 1
    score: residual_location_divided_by_total_scale
    auxiliary_direction_logit_used_as_return: false

  - id: volatility_expansion_breakout
    family: volume_volatility_breakout
    thesis: trade_breakout_only_with_joint_volatility_volume_and_model_confirmation
    inputs: [v8_predictions, d_known_daily, d_known_completed_10m]
    volatility_ratio_minimum: 1.50
    volume_ratio_minimum: 1.30
    residual_score_minimum: 0.20
    breakout_long_range_position_minimum: 1.0
    breakout_short_range_position_maximum: 0.0
    maximum_assets: 2
    allocation: equal_weight_selected_then_gross_normalize

multiple_testing_control:
  candidate_family_size: 10
  all_candidates_predeclared_before_new_pnl: true
  post_pnl_parameter_or_candidate_edit: forbidden
  same_trained_predictions_for_every_candidate: true
  same_full_evaluation_bundle_for_every_candidate: true
  annual_and_gate_worst_year_must_match_exactly: true
  scenario_selection: false
  development_years: [2021, 2022, 2023, 2024, 2025]
  ranking:
    - median_yearly_sharpe_descending
    - worst_calendar_year_return_descending
    - candidate_id_ascending_tiebreak
  hard_gates:
    positive_calendar_year_count_minimum: 4
    primary_net_cagr_minimum: 0.08
    primary_sharpe_minimum: 0.50
    primary_max_drawdown_maximum: 0.25
    worst_calendar_year_return_minimum: -0.10
    doubled_cost_cagr_strictly_positive: true
    critical_execution_failure_count: 0
    maximum_participation_bps: 100
    unknown_capacity_count: 0
    unresolved_positions_at_terminal: 0
  multiplicity_interpretation: finite_predeclared_family_plus_hurdle_gates_not_a_p_value_claim
  fifty_percent_cagr:
    threshold: 0.50
    report_only: true
    used_for_ranking: false
    used_for_holdout_access: false
  protected_holdout_access: locked_until_all_fixed_development_gates_pass
