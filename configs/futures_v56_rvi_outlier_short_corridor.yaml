protocol_id: futures_v56_rvi_outlier_short_corridor_v1
protocol_version: 1
status: sealed_after_source_audit_before_any_v56_market_value_signal_trade_or_pnl
declared_at_utc: '2026-09-02T18:20:00Z'
research_only: true
adaptive_same_history: true
live_trading_allowed: false

hypothesis: >-
  Elevated outright front RVI futures contain a directly traded volatility-risk premium:
  after a completed close enters a fixed high-volatility band, selling the same contract
  at the next factual open and taking profit inside a normal-volatility corridor should
  earn a positive convexity premium often enough to exceed 20% annualized return, while
  a distant absolute stop, expiry buffer, causal sizing and tail gates constrain crashes.

independence:
  mechanism: outright_front_contract_volatility_risk_premium
  not_v45_calendar_curve: true
  not_v14_portfolio_governor: true
  not_v55_rgbi_trend: true
  one_candidate_only: true
  no_parameter_search_or_sign_flip_after_outcome: true

source:
