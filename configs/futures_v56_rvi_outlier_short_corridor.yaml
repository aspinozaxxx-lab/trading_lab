  daily: {file: daily_history.parquet, sha256: 0d20e9b27905f146c7096ce5f1f1501cc7cdf8b373b4064536a44daf580cfcc3, rows: 4372}
  raw: {file: raw_responses.jsonl.gz, sha256: c9cacbaaad827fb042730780a88ce3dc1238633c1869e0c575b3287edbe15285, rows: 85}
