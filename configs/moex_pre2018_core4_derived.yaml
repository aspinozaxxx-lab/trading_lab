  src/market_lab/futures/spec_proxy.py: 213958f5e09b1eef458506fa9b541880d96febfeaa4aa3eabb9e961308164783
  src/market_lab/io_utils.py: ab453176a9195533c92a510d0fbaf1d03e628d0772f477930bf17cfd0fc395e0

temporal_contract:
  maximum_allowed_session: "2017-12-31"
  protected_2018_and_later_read: forbidden_for_this_build
  signal_or_strategy_computation: forbidden
  returns_targets_labels_equity_or_pnl_computation: forbidden
  future_columns_forbidden:
    - future_return
    - target
    - label
    - prediction
    - strategy_weight
    - pnl

limitations:
  current_vintage_source: true
  point_in_time_exchange_revision_history: unavailable
  participant_open_interest: unavailable
  exact_historical_specs_fees_margin_and_borrow: unavailable
  independent_strategy_validation_by_this_bundle_alone: false
  live_admission_possible: false

forbidden_after_seal:
  - changing_parent_source_or_its_bytes
  - changing_roll_rules_after_inspecting_derived_returns_or_outcomes
  - filling_unknown_observations_with_zero
  - bridging_missing_sessions_or_contract_rolls_with_returns
  - overwriting_the_output_bundle
