  daily_rows: 30059
  contracts: 155
  minimum_price_date: "2012-01-03"
  maximum_price_date: "2017-12-21"
  protected_from: "2018-01-01"

output:
  directory: data/processed/futures_pre2018/moex-core4-causal-derived-2012-2017-v1
  immutable: true
  overwrite_allowed: false
  files:
    - panel.parquet
    - active_contract_map.parquet
    - contract_observations.parquet
    - spec_proxy.parquet
    - audit.json
    - manifest.json
    - manifest.sha256

causal_roll:
  confirmation_days: 2
  hard_fallback_sessions: 5
  dominance_ratio: 1.0
  overlap_price_column: settle
  execution_price_column: open
  historical_rewrite: forbidden
  adjustment: forward_only_after_observed_roll
  missing_open_policy: preserve_missing
  missing_settle_policy: preserve_missing
  gap_or_roll_return_bridge: forbidden

participant_open_interest:
  available_in_parent_source: false
  policy: preserve_all_fields_as_missing
  zero_imputation: forbidden

specification_proxy:
  method: existing_causal_lag1_proxy
  same_session_spec_use: forbidden
  unknown_spec_policy: sizing_unusable
  historical_exchange_exact: false

implementation_dependencies:
  src/market_lab/futures/moex_pre2018_core4_derived.py: 0c54c2325fd925835ac72a528c495942cb4d04f0116f1792875cecbf60d851c0
  src/market_lab/futures/panel.py: ae52d9c71c0b38e35cbe72e993d1823d6fa57b4b960fa91549a465add6edfd30
