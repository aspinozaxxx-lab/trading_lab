scope: source_derived_no_strategy_no_outcomes
research_only: true
sealed_before_derived_tables: true
live_trading_allowed: false

purpose: >-
  Transform the immutable official-MOEX 2012-2017 core-four daily source into the
  same causal active-contract panel and lagged specification proxy used by the
  later research stack. This bundle contains prices and availability metadata but
  no returns, targets, labels, strategy decisions, equity, or PnL.

source:
  directory: data/processed/futures_pre2018/moex-core4-daily-current-vintage-2012-2017-v1
  manifest_sha256: e60d0bcacff17af0229d150552a70ac235e821c2d271970ea2567c212a5f3da6
  daily_sha256: 00a9a872557d1450c38ace291449ab6a1de17679c8fc12d57bf3b1738cd50e38
