  initial_cash_rub: 1000000.0
  exact_integer_contracts: true
  next_factual_open: true
  roll_atomicity: asset
  maximum_lagged_volume_participation: 0.01
  missing_or_unexecutable: cancel_and_clip
  terminal_policy: carry
  margin_or_gross_limit_bypass_forbidden: true

scenarios:
