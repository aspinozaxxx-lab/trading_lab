limitations:
  - V60 is adaptive same-history development and is not independent validation.
  - The 126-session rule was chosen economically, not estimated as a future optimum.
  - Parent shadow equity uses modeled public next-open execution, not broker fills.
  - Historical specifications, fees, margin and liquidity can differ from a broker account.
  - A pass only earns a new sealed forward challenger; it cannot guarantee profit or authorize live trading.
