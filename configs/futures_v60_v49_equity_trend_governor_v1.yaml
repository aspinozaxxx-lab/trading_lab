  candidate_count: 1
  parameter_search: false
  moving_average_sessions: 126
  risk_on_multiplier: 2.00
  risk_off_multiplier: 1.00
  warmup_multiplier: 1.00
  equality_is_risk_on: true
  hysteresis_or_cooldown: none
  lower_higher_window_or_multiplier_comparison: forbidden
  asset_year_scenario_or_threshold_selection_after_outcome: forbidden

