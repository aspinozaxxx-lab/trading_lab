protocol_id: futures_v60_v49_equity_trend_governor_v1
protocol_version: 1
status: sealed_before_any_v60_target_order_position_or_pnl
declared_at_utc: '2026-09-02T19:34:00Z'
research_only: true
adaptive_same_history: true
live_trading_allowed: false

hypothesis: >-
  The aggressive frozen V49 edge may be regime-persistent in its own causal shadow
  equity. Keeping 2.00x risk only while the strictly prior V49 primary shadow NAV is
  at or above its 126-session trailing mean, and reverting to the original 1.00x V39
  risk otherwise, can retain at least 20% CAGR under every cost scenario while reducing
  drawdown and bad-year dependence without changing any asset signal or direction.

