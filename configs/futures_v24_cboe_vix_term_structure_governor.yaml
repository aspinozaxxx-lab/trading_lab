protocol_id: futures_v24_cboe_vix_term_structure_governor_v1
protocol_version: 1
status: predeclared_before_v24_oos_outcomes
declared_at_utc: "2026-09-01T04:15:40Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
relationship_to_prior_work: >-
  Adaptive same-period stability hypothesis declared after V12 outcomes were observed.
  V24 preserves the byte-identical V12 signal, portfolio construction, risk budget,
  execution and costs. It carries each frozen weekly V12 target over every factual MOEX
  decision date and applies one daily binary global risk governor from the latest causally
  available Cboe VIX/VIX3M close pair. This is not an independent holdout.

parent_v12:
  protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
  metrics_sha256: c989377f7de65c3ef0a8dd52a1f5fcbf11c6ad8048119ea0a7b4402f47b23288
  primary_reference:
    total_return: 0.451113922334873
    cagr: 0.07731837008966158
    sharpe: 0.7624477569712388
    maximum_drawdown: 0.14152584161232418
    positive_years: 4
    worst_year: -0.026317846517727284
    total_cost_rub: 13387.28160116245

hypothesis:
  statement: >-
    A daily global risk-off switch based on causally available Cboe volatility-term-
    structure backwardation can improve frozen V12 Sharpe and maximum drawdown while
    retaining at least 5 percent CAGR and positive doubled/stress exact-execution returns.
  economic_mechanism:
    - VIX_is_a_forward_looking_30_day_SPX_option_implied_volatility_measure
    - VIX3M_is_a_forward_looking_3_month_SPX_option_implied_volatility_measure
    - VIX_above_VIX3M_is_a_structural_near_term_stress_state_not_a_fitted_threshold
    - daily_global_cash_can_cut_risk_between_weekly_V12_rebalances
    - the_governor_never_increases_frozen_V12_risk
  primary_comparison: frozen_v12_primary_reference_above
  reject_if:
    - any_input_identity_raw_replay_schema_temporal_or_availability_check_fails
    - sealed_daily_state_counts_do_not_match
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_cagr_is_below_0_05
    - primary_sharpe_or_drawdown_does_not_improve_on_frozen_v12
    - fewer_than_4_of_5_calendar_years_are_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_the_ratio_boundary_or_maximum_age
    - using_same_Moscow_day_US_close_before_its_conservative_availability
    - adding_VIX_levels_percentiles_smoothing_hysteresis_or_partial_scaling
    - changing_V12_signal_portfolio_execution_or_costs
    - inverting_the_governor_or_tuning_asset_specific_exceptions
    - blending_V12_or_V24_by_observed_metrics
    - treating_V24_as_independent_holdout_or_live_evidence

