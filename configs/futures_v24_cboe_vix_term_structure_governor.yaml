  trend_price: causal_forward_additive_adjusted_close_available_at_D_close
  vix_pair_selection: latest_row_with_available_at_less_than_or_equal_to_decision_at
  same_Moscow_calendar_day_US_close: forbidden_until_conservative_Chicago_day_end
