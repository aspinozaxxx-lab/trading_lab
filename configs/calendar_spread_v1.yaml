protocol_id: calendar_spread_economic_v1
protocol_version: 1
status: predeclared_before_first_spread_change_return_target_signal_or_pnl
declared_at_utc: "2026-09-01T12:30:00Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false

hypothesis:
  statement: >-
    Exchange-listed same-root calendar spreads may contain a market-neutral carry,
    convergence, volatility-corridor or short-horizon timing premium after conservative
    two-leg costs. A fixed family of ten rules, including a causal cross-asset MLP, is
    evaluated without choosing parameters from calendar-spread returns.
  primary_strategy: volatile_corridor_far_stop
  primary_comparison: flat_cash_zero_return
  family_size: 10
  best_of_family_is_exploratory_only: true
  no_strategy_selection_on_2024_2025: true

dates:
  source_minimum: "2021-01-04"
  source_maximum: "2025-12-18"
  development_start: "2021-01-04"
  development_end: "2023-12-31"
  evaluation_start: "2024-01-01"
  evaluation_end: "2025-12-31"
  execution_market_maximum: "2025-12-30"
  protected_from: "2026-01-01"
  timezone: Europe/Moscow

inputs:
  derived_manifest:
    path: data/processed/info_radar/moex-calendar-spread-derived-2021-2025-v1/manifest.json
    sha256: b5e15c2ef846ab051db6d78c4074db2e03f56faa9aac71ae86bcf3d82034b234
    bytes: 7625
  active_spreads:
    path: data/processed/info_radar/moex-calendar-spread-derived-2021-2025-v1/active.parquet
    sha256: fc9257ad6be435de563d1fe574ba71cf5a8688a11559acc1d20a764f74f7fb71
    bytes: 743482
    rows: 4366
    minimum_timestamp: "2021-01-04"
    maximum_timestamp: "2025-12-18"
  contract_observations:
    path: data/processed/futures_v5/development_panel_2018_2025_contract_observations.parquet
    sha256: a1c650780d08e31668829bc5bb07d0aeb25239d44f8f3620cb2d054ded70acf6
    bytes: 1873470
    rows: 66052
    minimum_timestamp: "2018-01-03"
    maximum_timestamp: "2025-12-30"
  spec_proxy:
    path: data/processed/futures_v5_specs_v1/spec_proxy_2018-01-01_2025-12-31_87372f337a75eeb4/spec_proxy.parquet
    sha256: 8494235f8782a258ed86d448c1c57adf2d313062da06845211991bda2f76d682
    bytes: 6218382
    rows: 66052
    minimum_timestamp: "2018-01-03"
    maximum_timestamp: "2025-12-30"

information_set:
  spread_price_definition: far_futures_price_minus_near_futures_price
  buy_spread_legs: long_far_short_near_equal_contract_quantity
  decision: after_completed_public_archive_EOD_row
  archive_available_at: next_calendar_day_midnight_Europe_Moscow
  execution_not_before: first_later_factual_common_open_of_both_legs
  signal_price: EOD_arithmetic_bid_ask_midpoint
  baseline: prior_observations_of_same_spread_only
  cross_asset_features: exact_same_trade_date_only
  missing_cross_asset_policy: training_median_imputation_with_missing_indicators
  zero_imputation: forbidden
  protected_market_values: any_timestamp_on_or_after_2026_01_01_forbidden

features:
  baseline_windows_observations: [10, 20, 40]
  spread_change_scale_window: 20
  volatility_window: 10
  volatility_regime_prior_median_window: 20
  momentum_horizon_observations: 5
  cross_asset_minimum_assets: 3
  cross_sectional_range_entry: 2.5
  quote_width_maximum_change_sigma: 2.0
  new_entry_requires_strict_positive_quote_width: true
  minimum_days_to_near_expiration_for_entry: 12
  forced_exit_days_to_near_expiration: 4
  new_entries_on_last_source_row: forbidden_as_terminal_test_boundary
  last_outside_reported_range_is_not_a_filter: true

strategies:
  - id: volatile_corridor_far_stop
    family: mean_reversion
    score: z20
    scale: std20
    direction: fade
    entry_abs: 1.50
    exit_abs: 0.35
    stop_abs: 4.00
    maximum_holding_observations: 10
    high_volatility_only: true
    cross_sectional_extreme_only: false
  - id: all_regime_corridor_20
    family: mean_reversion
    score: z20
    scale: std20
    direction: fade
    entry_abs: 1.50
    exit_abs: 0.35
    stop_abs: 4.00
    maximum_holding_observations: 10
    high_volatility_only: false
    cross_sectional_extreme_only: false
  - id: fast_corridor_10
    family: mean_reversion
    score: z10
    scale: std10
    direction: fade
    entry_abs: 1.75
