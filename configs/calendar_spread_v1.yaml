    cross_sectional_extreme_only: false
  - id: momentum_5
    family: momentum
    score: momentum5
    scale: std20
    direction: follow
    entry_abs: 1.00
    exit_abs: 0.15
    stop_abs: 3.00
    maximum_holding_observations: 5
    high_volatility_only: false
    cross_sectional_extreme_only: false
  - id: curve_convergence_to_zero
    family: structural_convergence
    score: zero_convergence_score
    scale: std20
    direction: fade
    entry_abs: 2.00
    exit_abs: 0.50
    stop_abs: 6.00
    maximum_holding_observations: 10
    high_volatility_only: false
    cross_sectional_extreme_only: false
  - id: cross_asset_residual_fade
    family: cross_asset_mean_reversion
