  - id: mlp_cross_asset_5d
    family: causal_neural_timing
    score: mlp_prediction
    scale: std20
    direction: follow
    entry_abs: 0.25
    exit_abs: 0.05
    stop_abs: 3.00
    maximum_holding_observations: 5
    high_volatility_only: false
    cross_sectional_extreme_only: false

neural_model:
  implementation: sklearn_MLPRegressor_CPU
  target: same_spread_future_5_observation_midpoint_change_divided_by_current_prior_std20
  target_horizon_observations: 5
  target_clip: [-3.0, 3.0]
  training: expanding_window
  refit_schedule: first_factual_prediction_date_each_calendar_month
  target_availability: target_end_trade_date_strictly_before_refit_prediction_date
  minimum_training_samples: 250
  hidden_layer_sizes: [16, 8]
  activation: tanh
  solver: adam
  alpha: 0.01
  learning_rate_init: 0.001
  maximum_iterations: 300
  random_state: 1729
  shuffle: false
  early_stopping: false
  feature_imputation: training_median_plus_missing_indicators
  feature_scaling: training_standard_scaler
  hyperparameter_search: false

portfolio:
  initial_cash_rub: 1000000.0
  equal_contract_quantity_per_spread_leg: true
  target_pair_gross_fraction_of_current_cash: 0.40
  maximum_total_gross_notional_multiple: 1.60
  initial_margin_buffer_multiple: 2.0
  simultaneous_asset_order: [SI, RI, BR, MIX]
  same_asset_overlapping_positions: forbidden
  position_size: floor_current_cash_times_pair_fraction_divided_by_sum_lagged_leg_notionals
  capacity_clip: minimum_of_desired_and_both_leg_capacities

execution:
  implementation: custom_equal_quantity_two_leg_daily_variation_margin_ledger_v1
  entry: first_later_factual_common_leg_open_then_clip_or_skip
  exit: first_later_factual_common_leg_open_with_full_both_leg_capacity
  exit_retry: daily_until_full_pair_exit_or_terminal_failure
  atomicity: both_legs_of_one_calendar_spread
  maximum_participation_each_leg: 0.01
  participation_denominator: immediately_prior_factual_volume_of_same_contract
  pnl: long_far_minus_short_near_with_session_specific_accounting_point_values
  intraday_entry_mark: entry_open_to_same_session_settlement
  subsequent_mark: prior_factual_settlement_to_current_factual_settlement
  exit_mark: prior_factual_settlement_to_exit_open
  missing_factual_pair_mark: preserve_and_count_never_zero_impute
  terminal_policy: force_decision_on_last_source_row_then_require_factual_exit_before_protected_boundary
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}

validation:
  primary_period: "2024-01-01..2025-12-31"
  development_period_reported_separately: true
  all_ten_strategies_and_all_three_cost_scenarios_reported: true
  primary_strategy_only_can_reach_gate: true
  minimum_evaluation_CAGR: 0.10
  minimum_evaluation_sharpe: 1.00
  maximum_evaluation_drawdown: 0.15
  minimum_positive_evaluation_years: 2
  stress_evaluation_total_return_must_be_positive: true
  minimum_completed_evaluation_trades: 20
  execution_must_be_complete: true
  independent_confirmation_required: true

output:
  directory: runs/calendar_spread_economic_2021_2025_v1
  immutable: true
  overwrite_allowed: false
  artifacts:
    - metrics.json
    - report.md
    - plans.parquet
    - model_predictions.parquet
    - daily.parquet
    - trades.parquet
    - audit.json
    - manifest.json
    - manifest.sha256

limitations:
  development_family_and_internal_2024_2025_split_are_not_independent_confirmation: true
  source_is_current_vintage: true
  archive_quotes_are_EOD_not_order_time: true
  execution_uses_synchronized_leg_open_proxy_not_historical_spread_order_queue: true
  historical_exchange_specs_fees_margin_and_point_values_are_approximate: true
  missing_original_daily_vintages: true
  ten_hypotheses_create_multiple_testing_risk: true
  neural_sample_is_small_and_nonstationary: true
  guaranteed_future_return: false
  live_trading_allowed: false

implementation_dependencies:
  src/market_lab/futures/calendar_spread_v1.py: f8d0108e87c0c1eed5e841aab35e1bc2f59485e67ce3bd18aed9920c16213282
  src/market_lab/futures/moex_calendar_spread_derived_v1.py: d04f7d8f23ec5fce45d7b8879d41c130201e93695bceb3ca8891e6bd465c6f11
  src/market_lab/futures/execution_dataset.py: fc83cbf1f08fb38084488a41e618cc103c0ba27b0563b0d12293eca15548c663
  src/market_lab/io_utils.py: ab453176a9195533c92a510d0fbaf1d03e628d0772f477930bf17cfd0fc395e0

forbidden_after_seal:
  - changing_any_strategy_threshold_horizon_or_direction_after_viewing_results
  - selecting_the_best_of_ten_as_confirmed_without_new_unseen_data
  - using_target_end_dates_not_strictly_before_each_neural_refit_date
  - unequal_contract_quantities_between_spread_legs
  - entering_on_locked_or_zero_width_archive_quotes
  - using_same_day_open_before_archive_availability
  - ignoring_leg_specific_point_values_costs_capacity_or_margin
  - reading_any_market_value_timestamp_on_or_after_2026_01_01
  - overwriting_the_canonical_run
  - live_trading_or_claiming_guaranteed_profit
