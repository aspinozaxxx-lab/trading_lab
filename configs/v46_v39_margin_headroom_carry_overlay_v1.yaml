hypothesis: >-
  Preserve 100% of frozen V39 instead of diluting it to 80%, and use a fixed 20% of
  causally verified free margin headroom for the frozen active-cap broad cash-carry
  sleeve. Add only carry return above the displaced 50% RUONIA cash baseline. This
  self-financing overlay may improve V39 return and worst year without adding
  directional leverage.

