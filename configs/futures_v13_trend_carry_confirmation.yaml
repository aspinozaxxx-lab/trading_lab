universe:
  exact_order: [SI, RI, BR, MIX]
  aliases: {Si: SI, RTS: RI, BR: BR, MIX: MIX}
  membership: fixed_research_universe_not_historical_index_membership
  minimum_signal_assets: 1

information_set:
  decision: after_completed_official_daily_close_D
  trend_price: causal_forward_additive_adjusted_close_available_at_D_close
  curve_snapshot: simultaneous_front_and_next_settles_observed_through_D_close
  execution_not_before: active_contract_factual_open_on_effective_date_strictly_after_D
  missing_trend_or_curve: missing_score_and_target_cash_not_zero_imputation
  opposite_or_zero_confirmation: observed_neutral_score_and_target_cash
  future_columns_forbidden: [open_D_plus_1, settle_D_plus_1, return_D_plus_1, target, pnl]
  no_zero_imputation: true
  no_gap_or_roll_return_bridge: true

signal:
  id: core4_v12_trend_confirmed_by_front_next_carry
  inherited_v12_trend:
    log_momentum_horizons_sessions: [21, 63, 126, 252]
    recent_skip_sessions: 0
    volatility_lookback_sessions: 60
    annualization_sessions: 252
    volatility_floor_annualized: 0.05
    per_horizon_clip: [-2.0, 2.0]
    per_horizon_divisor: 2.0
    aggregation: arithmetic_mean_only_when_all_four_horizons_finite
  carry:
    formula: (front_settle_D / next_settle_D - 1) * 365 / calendar_days_between_expiries
    required_proof:
      - curve_observed_through_equals_decision_date
      - curve_available_at_equals_decision_close
      - front_and_next_settles_finite_and_positive
      - next_expiration_strictly_after_front_expiration
      - stored_roll_yield_matches_independent_recomputation
    normalization: sign_only
  final_score: >-
    frozen_v12_trend_score_when_trend_score_times_roll_yield_is_strictly_positive;
    observed_zero_when_both_inputs_are_finite_but_do_not_strictly_agree;
    missing_when_either_input_is_missing_or_unproved
  fit_or_training: none
  hyperparameter_search: false
  variants_after_outcome: forbidden

portfolio:
  implementation_contract: futures_causal_risk_portfolio_v1_byte_reused_from_v12
  decision_schedule: last_factual_session_of_each_W_SUN_week
  mandatory_additional_decisions: any_known_active_contract_change_for_a_nonzero_held_target
  signal_weight_between_weekly_decisions: carry_last_weekly_target
  ewma_volatility_span_sessions: 20
  covariance_lookback_sessions: 60
  covariance_assets: [SI, RI, BR, MIX]
  annual_target_volatility: 0.20
  gross_cap: 1.0
  turnover_sleeves: 5
  sleeve_unit: weekly_rebalance_decisions
  risk_scaling: only_downward_after_gross_cap
  target_missing_policy: zero_weight_for_that_asset

execution:
  initial_cash_rub: 1000000.0
  decision_to_fill: next_factual_effective_date_open
  integer_quantity: truncate_toward_zero_weight_times_current_cash_over_lagged_notional
  active_contract: exact_contract_known_at_decision_from_active_contract_map
  roll: explicit_old_exit_plus_new_entry_at_same_factual_open
  execution_atomicity: asset
  maximum_participation: 0.01
  participation_denominator: immediately_prior_factual_contract_volume
  maximum_gross_notional_multiple: 1.0
  initial_margin: modeled_25_percent_of_lagged_notional
  initial_margin_buffer_multiple: 2.0
  settlement_accounting: factual_variation_margin_with_open_gap_and_settlement_mark
  collateral_yield: 0.0
  terminal_policy: carry_with_terminal_positions_and_cost_limitation_reported
  missing_or_unprovable: reject_or_unresolved_never_zero_return
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}
  limitations:
    historical_exchange_exact: false
    broker_exact: false
    queue_and_bid_ask_exact: false
    point_value_fee_and_margin: frozen_conservative_research_proxy

validation:
  scheme: adaptive_fixed_development_oos_after_unsupervised_warmup
  warmup: "2018-01-03..2020-12-31"
  oos: "2021-01-01..2025-12-31"
  model_training: none
  parameter_selection_on_oos: forbidden
  protected_2026_read: forbidden

