protocol_id: futures_v13_trend_carry_confirmation_v1
protocol_version: 1
status: predeclared_before_v13_oos_outcomes
declared_at_utc: "2026-08-31T18:51:44Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
relationship_to_prior_work: >-
  Adaptive same-period challenger declared after V12 outcomes were observed. V13 changes
  only the signal admission rule by requiring the causal front/next futures curve to
  confirm the frozen V12 trend direction. A result on 2021-2025 is hypothesis generation,
  not independent confirmation, and cannot authorize live trading.

parent_v12:
  protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
  metrics_sha256: c989377f7de65c3ef0a8dd52a1f5fcbf11c6ad8048119ea0a7b4402f47b23288
  primary_reference:
    total_return: 0.451113922334873
    cagr: 0.07731837008966158
    sharpe: 0.7624477569712388
    maximum_drawdown: 0.14152584161232418
    positive_years: 4
    worst_year: -0.026317846517727284
    total_cost_rub: 13387.28160116245

hypothesis:
  statement: >-
    V12 trend positions whose direction is confirmed by the same-close annualized
    front/next roll yield should retain positive exact-execution PnL while reducing
    unproductive exposure, turnover costs or drawdown relative to frozen V12.
  economic_mechanism:
    - trend_and_curve_agreement_combines_price_persistence_with_carry
    - opposite_curve_sign_identifies_trends_with_an_adverse_roll_headwind
    - missing_or_unproved_curve_information_sends_the_asset_to_cash
  primary_comparison: frozen_v12_primary_reference_above
  reject_if:
    - any_required_input_identity_or_temporal_check_fails
    - any_curve_proof_or_roll_yield_recomputation_check_fails
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_cagr_is_below_0_05
    - primary_sharpe_or_drawdown_does_not_improve_on_frozen_v12
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - weakening_confirmation_with_a_tuned_carry_threshold
    - changing_trend_horizons_or_curve_formula
    - changing_rebalance_frequency_sleeves_target_volatility_or_caps
    - selecting_assets_or_costs_from_observed_v13_metrics
    - treating_v13_as_independent_holdout_or_live_evidence

