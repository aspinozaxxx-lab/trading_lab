paths:
  root: ..
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  runs_dir: runs

universe:
  development:
    - SBER
    - GAZP
    - LKOH
    - NVTK
    - ROSN
    - TATN
    - MOEX
    - VTBR
    - CHMF
    - PHOR
    - RUAL
  holdout:
    - ALRS
    - MAGN
    - NLMK
    - SNGS
    - MGNT
  board: TQBR
  timeframe: 1h

protocol:
  data_start: 2018-01-01
  validation_start: 2023-01-01
  validation_end: 2025-12-31
  test_start: 2026-01-01
  test_end: 2026-08-16
  validation_fold_months: 3
  embargo_days: 2

portfolio:
  initial_capital: 1000000.0
  commission_bps: 5.0
  slippage_bps: 2.0
  financing_rate_annual: 0.20
  maximum_gross_leverage: 2.0
  volatility_floor: 0.003

model:
  n_estimators: 400
  max_depth: 3
  learning_rate: 0.03
  min_child_weight: 50.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 20.0
  device: cuda

strategy:
  top_k: 1
  rebalance_days: 5
  regime_window: 20
  absolute_momentum_window: 60
  core_leverage: 1.0
  risk_scenarios:
    - 1.0
    - 1.5
    - 2.0
  target_cagr: 0.50
  maximum_core_drawdown: 0.25

seed: 42
