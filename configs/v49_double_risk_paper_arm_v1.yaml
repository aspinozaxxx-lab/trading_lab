fixed_arm:
  name: double_risk
  V39_mapped_target_multiplier: 2.00
  maximum_gross_notional_multiple: 4.00
  initial_margin_buffer_multiplier: 2.00
  maximum_prior_official_volume_participation: 0.01
  broad_carry_cash_fraction: 0.00
  exact_integer_contracts: true
  V39_signs_zeros_windows_and_quantiles_unchanged: true
