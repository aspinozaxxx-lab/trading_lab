  decision_signal: byte_identical_V39_after_postseal_joint_warmup
  decision_price: official_MOEX_daily_CLOSE
  decision_option_state: latest_completed_week_strictly_before_decision_week
  sizing_equity: prior_paper_equity
  sizing_specs_and_initial_margin: latest_postseal_captured_before_order
  next_session_execution_observation: required
  buy_mark: observed_OFFER
  sell_mark: observed_BID
  missing_side_or_nonpositive_depth: cancel_asset_order
  margin_or_gross_or_participation_failure: cancel_and_clip_without_bypass
  roll_atomicity: asset
  terminal_policy: carry_with_exit_cost_reserve
  broker_fill_substitution: forbidden
  synthetic_backfill_or_forward_fill: forbidden

sequential_phases:
  option_unique_weekly_levels_required: 54
  futures_common_official_CLOSE_levels_required: 253
  paper_economics_begins_only_after_joint_warmup: true
  minimum_unseen_futures_sessions: 504
  minimum_unseen_weekly_decisions: 104
  minimum_full_calendar_years: 2
  interim_CAGR_arm_selection_or_promotion: forbidden

cost_scenarios:
  primary:
    quote_side: observed_bid_offer
    captured_exchange_clearing_and_broker_fees_required: true
  doubled:
    exchange_clearing_and_broker_fee_multiplier: 2.0
  stress:
    observed_bid_offer_additional_adverse_ticks: 2
    exchange_clearing_and_broker_fee_multiplier: 2.0

promotion_gates:
  all_scenario_CAGR_minimum: 0.20
  stretch_all_scenario_CAGR: 0.40
  aspirational_primary_CAGR_report_only: 0.50
  all_scenario_sharpe_minimum: 1.00
  maximum_drawdown_maximum: 0.40
  worst_full_year_minimum: -0.15
  positive_full_years_minimum: 2
  maximum_observed_participation: 0.01
  critical_failures_maximum: 0
  unresolved_halts_maximum: 0
  every_parent_snapshot_audit_required: true
  broker_statement_reconciliation_before_live: required
  second_unseen_confirmation_after_numeric_pass: required
  live_trading_after_first_or_second_pass: forbidden_without_separate_admission

forbidden_after_seal:
  - counting_any_snapshot_retrieved_before_this_paper_seal
  - changing_multiplier_gross_margin_capacity_carry_or_target_states
  - selecting_V48_or_V49_from_interim_or_final_forward_outcome
  - changing_warmup_evaluation_costs_or_promotion_gates
  - replacing_observed_bid_offer_with_OPEN_midpoint_or_synthetic_fill
  - reporting_annualized_result_before_full_evaluation
  - live_trading_without_new_admission_and_broker_reconciliation

outputs:
