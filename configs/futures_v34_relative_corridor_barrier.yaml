hypothesis:
  statement: >-
    A neural meta-label can identify RI/MIX relative deviations that reach a fixed
    one-sigma take-profit corridor before a three-times-distant stop, using simultaneous
    four-market state plus the same-day MOEX option-curve regime. Sparse atomic pair
    entries should reduce outright beta and turnover enough to remain profitable across
    three calendar segments and all predeclared cost scenarios.
  change_from_v32_v33:
    - probability of barrier ordering instead of absolute return regression
    - relative RI/MIX residual instead of four independent outright positions
    - at most two nonoverlapping atomic pair trades per day
    - fixed-rule and market-only ablations rather than post-outcome sign changes
  no_sign_inversion_after_observation: true
  no_threshold_or_horizon_search_inside_reported_test_months: true

