hypothesis:
  statement: >-
    The V32 signal family can be evaluated over its full horizon without weakening the
    one-percent factual participation constraint if de-risking orders are partially
    filled and carried causally, reversals close before opening the opposite side, and
    a scheduled daily flat is retried for at most six exact ten-minute buckets.
  economic_hypothesis_changed_from_V32: false
  execution_hypothesis_changed_from_V32: true
  rationale: >-
    A one-contract position cannot trade in a bucket with volume below 100 under an
    integer one-percent cap, but the next exact bucket can have capacity. Halting the
    entire multi-year ledger is not a realistic representation of a resting de-risking
    instruction; carrying exposure and marking every intervening open is conservative.

retry:
  maximum_flat_retry_bars: 6
  de_risk_capacity_policy: partial_fill_then_carry
  reversal_policy: close_first_then_open_with_remaining_capacity
  risk_increase_capacity_policy: partial_fill_no_queue

execution:
