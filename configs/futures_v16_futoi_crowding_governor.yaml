hypothesis:
  statement: >-
    Keep 2x frozen-V12 exposure except when the latest causally available retail
    positioning is at least one warmup robust sigma more trend-aligned than its asset
    baseline; use base 1x in that crowded state or when FUTOI is stale. This can retain
    at least 20 percent combined CAGR while reducing maximum drawdown to at most 25
    percent under capacity-aware execution.
  economic_mechanism:
    - extreme_retail_trend_alignment_can_signal_crowded_late_trend_risk
    - normal_or_contrarian_retail_positioning_keeps_the_aggressive_two_x_state
    - stale_information_falls_back_to_base_risk_instead_of_zero_imputation
    - no_open_or_no_lagged_volume_cancels_only_the_current_order_attempt
    - known_participation_clips_quantity_before_fill
  reject_if:
    - any_identity_temporal_warmup_or_source_check_fails
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_combined_cagr_is_below_0_20
    - primary_combined_maximum_drawdown_exceeds_0_25
    - primary_combined_positive_years_are_below_4_of_5
    - doubled_or_stress_combined_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_robust_z_threshold_staleness_or_risk_multipliers
    - changing_retail_imbalance_definition_or_client_group
    - using_same_day_futoi_for_a_close_decision
    - changing_ruonia_haircut_buffer_or_day_count
    - special_casing_march_2022_dates_assets_or_contracts
    - treating_v16_as_independent_holdout_or_live_evidence

