relationship_to_prior_work: >-
  Adaptive same-period risk-governor test declared after V15. Frozen V12 trend is
  scaled between base 1x and aggressive 2x using newly acquired target-free MOEX
  FUTOI retail crowding. V15 RUONIA economics are unchanged. This is not independent
  confirmation.

