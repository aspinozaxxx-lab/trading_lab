  protocol_sha256: a1ec093e64f79f48371c60ec8c18abfbaece4e22a22bb60086c58ef594aac1f3
  manifest_sha256: 0453f05c2b89f9c1df169f4b89356ec4093bc56f46a56edc99dd89b46a2e6e66
