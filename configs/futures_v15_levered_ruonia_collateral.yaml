universe:
  exact_order: [SI, RI, BR, MIX]
  aliases: {Si: SI, RTS: RI, BR: BR, MIX: MIX}
  membership: fixed_research_universe_not_historical_index_membership
  minimum_signal_assets: 1

information_set:
  decision: after_completed_official_daily_close_D
  trend_price: causal_forward_additive_adjusted_close_available_at_D_close
  ruonia_read_filter: parquet_predicate_series_id_equals_ruonia_only
  ruonia_rate_for_interval: latest_available_at_or_before_accrual_start_00_00_Moscow
  execution_not_before: active_contract_factual_open_on_effective_date_strictly_after_D
  future_columns_forbidden: [open_D_plus_1, settle_D_plus_1, return_D_plus_1, target, pnl]
  no_zero_imputation: true
  no_gap_or_roll_return_bridge: true

signal:
  id: byte_identical_v12_core4_trend
  log_momentum_horizons_sessions: [21, 63, 126, 252]
  recent_skip_sessions: 0
  volatility_lookback_sessions: 60
  annualization_sessions: 252
  volatility_floor_annualized: 0.05
  score_implementation: imported_frozen_v12
  fit_or_training: none
  hyperparameter_search: false

leverage:
  target_weight_multiplier: 2.0
  maximum_gross_notional_multiple: 2.0
  annual_target_volatility_before_integer_constraints: 0.40
  initial_margin_buffer_multiple: 2.0
  risk_budget_fit: existing_integer_downscale_never_relax_margin_or_gross
  variants_after_outcome: forbidden

collateral_income:
  benchmark: official_RUONIA_percent_per_annum
  applied_rate_fraction: 0.50
  haircut_interpretation: aggregate_tax_product_fee_tracking_liquidity_and_access_haircut
  day_count: ACT_365_calendar_days
  operational_buffer_fraction_of_conservative_equity: 0.10
  conservative_equity: min(ending_cash_intraday_adverse_equity)
  encumbered_amount: 2_times_modeled_initial_margin
  eligible_balance_formula: >-
    max(0, conservative_equity - 2*modeled_initial_margin -
    0.10*conservative_equity)
  interval: current_factual_session_to_next_factual_session_clipped_at_oos_start
  final_session_interest: none
  reinvested_into_contract_sizing: false
  compounded_into_future_eligible_balance: false
  principal_double_counted: false
  missing_rate: fail_closed_no_valid_combined_metrics

portfolio:
  implementation_contract: futures_causal_risk_portfolio_v1_byte_reused_from_v12
  decision_schedule: last_factual_session_of_each_W_SUN_week
  mandatory_additional_decisions: any_known_active_contract_change_for_a_nonzero_held_target
  signal_weight_between_weekly_decisions: carry_last_weekly_target
  ewma_volatility_span_sessions: 20
  covariance_lookback_sessions: 60
  covariance_assets: [SI, RI, BR, MIX]
  annual_target_volatility_before_leverage: 0.20
  base_gross_cap_before_leverage: 1.0
  turnover_sleeves: 5
  sleeve_unit: weekly_rebalance_decisions
  target_missing_policy: zero_weight_for_that_asset

execution:
  initial_cash_rub: 1000000.0
  decision_to_fill: next_factual_effective_date_open
  integer_quantity: truncate_toward_zero_weight_times_current_cash_over_lagged_notional
  active_contract: exact_contract_known_at_decision_from_active_contract_map
  roll: explicit_old_exit_plus_new_entry_at_same_factual_open
  execution_atomicity: asset
  maximum_participation: 0.01
  participation_denominator: immediately_prior_factual_contract_volume
  maximum_gross_notional_multiple: 2.0
  initial_margin: modeled_25_percent_of_lagged_notional
  initial_margin_buffer_multiple: 2.0
  settlement_accounting: factual_variation_margin_with_open_gap_and_settlement_mark
  terminal_policy: carry_with_terminal_positions_and_cost_limitation_reported
  missing_or_unprovable: reject_or_unresolved_never_zero_return
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}
  limitations:
    collateral_product_and_tax_exact: false
    ruonia_current_vintage: true
    historical_exchange_exact: false
    broker_exact: false
    queue_and_bid_ask_exact: false
    point_value_fee_and_margin: frozen_conservative_research_proxy

validation:
  scheme: adaptive_fixed_development_oos
  warmup: "2018-01-03..2020-12-31"
  oos: "2021-01-01..2025-12-31"
  model_training: none
  number_of_oos_variants: 1
  parameter_selection_on_oos: forbidden
  protected_2026_read: forbidden

reporting:
  required_metrics:
    - futures_only_total_return_cagr_sharpe_mdd
    - collateral_income_rub_and_return_contribution
    - combined_total_return_cagr_sharpe_mdd
    - combined_annual_returns_2021_2025
    - combined_positive_years_and_worst_year
    - turnover_costs_participation_gross_margin
    - ruonia_coverage_and_accrual_days
    - execution_coverage_and_unresolved
  artifacts:
    - resolved_protocol.yaml
    - identity.json
    - scores.parquet
    - weekly_weights.parquet
    - levered_weights.parquet
    - mapped_targets.parquet
    - decision_audit.csv
    - coverage.csv
    - collateral_primary.parquet
    - combined_ledger_primary.parquet
    - ledger_primary.parquet
    - orders_primary.parquet
    - positions_primary.parquet
    - collateral_doubled.parquet
    - combined_ledger_doubled.parquet
    - ledger_doubled.parquet
    - orders_doubled.parquet
    - positions_doubled.parquet
    - collateral_stress.parquet
    - combined_ledger_stress.parquet
    - ledger_stress.parquet
    - orders_stress.parquet
    - positions_stress.parquet
    - metrics.json
    - report.md

promotion_rule:
  scope: go_to_new_unseen_validation_only_never_live
  require_all:
    - every_input_ruonia_accrual_and_temporal_check_true
    - all_three_scenarios_execution_and_combined_metrics_complete
    - zero_critical_failures_and_zero_unresolved_halts
    - primary_combined_cagr_at_least_0_20
    - primary_combined_maximum_drawdown_at_most_0_25
    - primary_combined_positive_years_at_least_4_of_5
    - doubled_combined_total_return_positive
    - stress_combined_total_return_positive
    - no_order_time_gross_participation_or_margin_breach
  independent_confirmation_required: true
