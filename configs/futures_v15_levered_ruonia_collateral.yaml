protocol_id: futures_v15_levered_ruonia_collateral_v1
protocol_version: 1
status: predeclared_before_v15_oos_outcomes
declared_at_utc: "2026-08-31T20:27:14Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
relationship_to_prior_work: >-
  Adaptive same-period capital-efficiency feasibility test declared after V12-V14
  outcomes. It uses frozen V12 alpha and exact execution, doubles target weights within a
  2x gross cap and unchanged 2x modeled-margin buffer, and adds conservative causal
  RUONIA income only on unencumbered collateral. It is not independent confirmation.

parent_v12:
  protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
  metrics_sha256: c989377f7de65c3ef0a8dd52a1f5fcbf11c6ad8048119ea0a7b4402f47b23288
  primary_reference:
    total_return: 0.451113922334873
    cagr: 0.07731837008966158
    sharpe: 0.7624477569712388
    maximum_drawdown: 0.14152584161232418
    positive_years: 4
    worst_year: -0.026317846517727284
    total_cost_rub: 13387.28160116245

hypothesis:
  statement: >-
    Two-times frozen V12 risk plus conservatively haircutted, causally available RUONIA
    income on truly unencumbered collateral can reach at least 20 percent combined CAGR
    with maximum drawdown no greater than 25 percent after exact futures costs.
  economic_mechanism:
    - futures_require_margin_rather_than_full_notional_funding
    - unused_collateral_can_earn_short_term_ruble_income
    - leverage_uses_the_existing_trend_edge_without_new_signal_selection
  primary_comparison: frozen_v12_primary_reference_and_cash_zero_return
  reject_if:
    - any_input_identity_temporal_ruonia_or_accrual_check_fails
    - any_critical_execution_failure_or_unresolved_halt_remains
    - combined_primary_cagr_is_below_0_20
    - combined_primary_maximum_drawdown_exceeds_0_25
    - combined_primary_positive_years_are_below_4_of_5
    - doubled_or_stress_combined_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_leverage_haircut_buffer_or_day_count
    - reducing_the_2x_modeled_margin_buffer
    - charging_interest_on_margin_or_negative_free_collateral
    - reinvesting_interest_into_contract_sizing_post_hoc
    - selecting_a_v12_v13_v14_parent_by_v15_outcomes
    - treating_v15_as_independent_holdout_or_live_evidence

