collection:
  method: HTTPS_GET
  expected_responses: 8
  preserve_raw_html_base64_in_gzip_jsonl: true
  normalized_events_exactly_equal_config: true
  response_status_must_be_200: true
  content_type_must_contain_text_html: true
  minimum_raw_bytes_per_response: 50000
  retries: 3
  timeout_seconds: 30

output:
  directory: data/processed/info_radar/moex-stock-split-adjustments-2024-2025-v1
  immutable: true
  contents_in_git: false

quality_gates:
  exact_4_events_and_8_urls: true
  exact_27_pre_action_contracts_adjusted: true
  raw_hashes_and_replay_exact: true
  adjusted_spot_units_positive_integer_for_every_affected_contract: true
  only_TRNFP_GMKN_PLZL_VTBR_are_adjusted: true
  no_basis_returns_targets_signals_predictions_equity_or_pnl: true

limitations:
  - Notices prove split/consolidation dates and public contract parameters, not fills.
  - The source corrects unit identity only and cannot rescue a strategy by selection.
  - Historical stock candles remain current-vintage and may contain other adjustments.
  - No output can authorize live trading or guarantee profit.

forbidden_output_fragments: [basis, return, target, label, signal, prediction, equity, pnl, profit]
