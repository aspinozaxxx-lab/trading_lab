protocol_id: moex_stock_split_adjustment_source_v1
protocol_version: 1
status: sealed_after_official_split_facts_observed_before_corrected_economic_replay
declared_at_utc: '2026-09-02T08:15:00Z'
scope: source_identity_only_no_basis_return_signal_trade_or_pnl
research_only: true
live_trading_allowed: false

objective: >-
  Preserve official MOEX notices needed to reconcile current-vintage back-adjusted
  stock candles with historical futures contract lots. This source invalidates the
  naive use of description LOTSIZE as the number of adjusted spot shares; it does not
  select opportunities or compute economics.

