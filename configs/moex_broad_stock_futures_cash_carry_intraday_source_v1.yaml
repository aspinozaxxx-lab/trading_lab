contract_selection:
  request_one_series_response_per_exact_underlying_asset: true
  show_expired: 1
  expiration_date_inside_declared_period: true
  underlying_asset_must_equal_stock: true
  name_must_contain_hyphen: true
  secid_regex: '^[A-Z0-9]{2,3}[FGHJKMNQUVXZ][0-9]$'
  calendar_spreads_and_perpetuals_forbidden: true
  asset_code_is_preserved_not_mapped_to_current_vintage: true
  sort: [stock_order, expiration_date, secid]
  exact_total_must_equal: 339
  no_contract_for_ENPG_is_explicit_missing_coverage_not_zero_imputation: true
  price_volume_basis_return_signal_or_pnl_must_not_affect_selection: true

official_sources:
  provider: Moscow_Exchange_MOEX_ISS
  access_mode: anonymous_public_ISS_current_vintage
  series: https://iss.moex.com/iss/statistics/engines/futures/markets/forts/series.json
  description_template: https://iss.moex.com/iss/securities/{secid}.json
  candles_template: https://iss.moex.com/iss/engines/futures/markets/forts/boards/RFUD/securities/{secid}/candles.json
  candle_interval_minutes: 10
  page_limit: 500

description_gates:
  exact_SECID: true
  TYPE_must_equal_futures: true
  RFUD_board_required: true
  ASSETCODE_must_equal_selected_series_row: true
  positive_integer_historical_description_LOTSIZE_required: true
  FRSTTRADE_LSTTRADE_LSTDELDATE_preserved: true
  description_is_current_vintage_not_point_in_time: true

temporal_semantics:
  candle_begin_and_end_are_exchange_time_Europe_Moscow: true
  candle_is_available_at_its_end_timestamp: true
  request_from: max_period_start_series_start_description_first_trade
  request_till: min_period_end_series_expiration_description_last_trade
  stable_monotonic_pagination_required: true
  missing_candle_is_missing_never_zero: true

dependencies:
  fixed_universe_source:
    file: configs/moex_forward_broad_stock_futures_carry_source_v1.yaml
    sha256: 5cd396e0033f26d161227dfbbdaef8812769d852dd3940d9e8f5bf8c8faabf70
  spot_source:
