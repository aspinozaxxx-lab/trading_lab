    manifest_sha256: 5a7a4873f01141682c9c53d0714d235187eec6b57e5449b23bb04e68c4593042
    used_by_this_source_collection: false

collection:
  preserve_all_series_descriptions_and_candle_pages_exactly: true
  immutable_atomic_output: true
  raw_replay_exact_required: true
  partial_collection_cannot_be_promoted: true
  network_retries: 3
  request_timeout_seconds: 30

output:
  directory: data/processed/info_radar/moex-broad-stock-futures-carry-intraday-2023-2025-v1
  contents_in_git: false
  immutable: true

quality_gates:
  exact_339_contract_catalog_replayed: true
  all_candle_timestamps_before_2026: true
  unique_contract_timestamp: true
  exact_raw_and_processed_hashes: true
  explicit_contract_and_stock_coverage: true
  no_basis_returns_targets_signals_predictions_equity_or_pnl: true

future_economic_protocol_not_active_here:
  retain_frozen_V1_entry_threshold_DTE_time_cashflow_haircut_and_costs: true
  broad_universe_is_the_only_intended_mechanism_change: true
  compare_equal_capital_and_concentration_capped_portfolios: true
  primary_doubled_zero_cashflow_and_delayed_fill_stresses_required: true
  execution_remains_unproved_without_forward_BID_OFFER_and_broker_logs: true

forbidden_output_fragments:
  - basis
  - return
  - target
  - label
  - signal
  - prediction
  - equity
  - pnl
  - profit

limitations:
  - Anonymous historical candles have no BID/OFFER, queue, aggressor side or broker reject.
  - Current descriptions do not prove historical lot, fee, margin or corporate-action rules.
  - ENPG has no selected 2023-2025 outright contract and remains explicit missing coverage.
  - A wider source can increase opportunity count but cannot guarantee profit or live validity.
