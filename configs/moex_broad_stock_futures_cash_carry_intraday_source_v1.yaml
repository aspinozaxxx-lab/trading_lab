protocol_id: moex_broad_stock_futures_cash_carry_intraday_source_v1
protocol_version: 1
status: sealed_after_metadata_only_339_contract_preflight_before_any_selected_candles
declared_at_utc: '2026-09-02T06:39:00Z'
scope: source_only_no_basis_returns_targets_signals_or_pnl
research_only: true
live_trading_allowed: false

objective: >-
  Build an immutable official-MOEX 10-minute futures panel for every historical
  outright contract of the fixed thirty-stock universe in 2023-2025. This expands
  the prior five-underlying/61-contract cash-and-carry source without choosing assets,
  contracts or dates from price, basis, return, signal or PnL.

