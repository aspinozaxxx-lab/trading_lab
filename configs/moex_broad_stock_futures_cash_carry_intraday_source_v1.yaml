  official_series_filter: show_expired_1_and_exact_underlying_asset
  quote_candle_basis_return_signal_or_pnl_read: false
  fixed_stocks_checked: 30
  stocks_with_at_least_one_historical_outright: 29
  exact_selected_contracts: 339
