protocol_id: futures_v22_cbr_business_climate_regime_v1
protocol_version: 1
status: sealed_before_any_v22_market_outcome_read
declared_at_utc: "2026-09-01T02:50:00Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
source_commit_before_protocol: 7fee819
relationship_to_prior_work: >-
  New release-specific information family from the official Bank of Russia Business
  Climate Index. Market outcomes for 2021-2025 were seen in unrelated experiments, and
  the historical pages were retrieved currently rather than archived at publication;
  V22 is development evidence and never independent holdout confirmation.

hypothesis:
  statement: >-
    A month-to-month improvement in the printed composite Business Climate Index is a
    domestic risk-on and ruble-strength regime: long RI and MIX and short SI. A decline
    takes the symmetric direction. The composite is used because it combines current
    output/demand assessments with expectations and is published as a leading indicator.
  economic_mechanism:
    - improving_business_climate_maps_directly_to_RI_and_MIX
    - improving_business_climate_maps_inversely_to_USD_RUB_futures_SI
    - composite_printed_release_value_avoids_post_hoc_component_selection
    - signal_persists_until_next_release_or_fixed_expiry
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_is_not_changed_or_combined_in_this_run
  reject_if:
    - any_source_identity_schema_raw_or_temporal_check_fails
    - any_release_is_used_before_its_conservative_available_at
    - same_timestamp_collision_does_not_keep_the_latest_release_month
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - inverting_any_asset_sign
    - selecting_BCI_magnitude_thresholds_or_scaling
    - selecting_current_assessments_or_expectations_after_v22_metrics
    - using_chart_exact_decimals_instead_of_printed_one_decimal_labels
    - changing_risk_budgets_volatility_target_floor_or_expiry
    - changing_to_same_day_fill_or_earlier_release_availability
    - combining_with_V12_or_other_signals_based_on_v22_metrics
    - presenting_currently_retrieved_pages_as_original_publication_bytes

