limitations:
  - Scaling a known same-history winner is risk engineering, not independent alpha.
  - Modeled margin is not a broker guarantee and can jump beyond the 25% stress.
  - Daily proportional scaling is a normalized proxy; integer contract sizing is not replayed.
  - Public carry execution and the realizable collateral instrument remain unproved.
  - Historical results cannot guarantee profit or authorize live trading.
