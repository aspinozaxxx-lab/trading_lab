hypothesis: >-
  Scaling only frozen V39 market PnL within factual prior-session margin headroom can
  move the historical return frontier toward 50% without borrowing cash or changing
  any signal. A lower stability mode may retain broad carry, while an aggressive mode
  reserves all non-margin cash as collateral. Both modes and all stresses are reported;
  no mode is selected after outcomes.

