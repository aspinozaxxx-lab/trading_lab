  immutable_manifest_and_replay_audit: required
  signal_return_target_prediction_or_pnl: forbidden

state_at_seal:
  anonymous_FRED_snapshots: 0
  authenticated_FRED_snapshots: 0
  forward_economic_outcomes_computed: false

limitations:
  - A successful header probe does not guarantee future CDN availability.
  - Current-vintage FRED observations remain available no earlier than actual retrieval.
  - The transport correction does not prove return or authorize live trading.
