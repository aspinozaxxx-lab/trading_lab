protocol_id: futures_v27_forward_fred_anonymous_transport_v2
protocol_version: 2
status: sealed_after_header_transport_probe_before_first_successful_component_response
declared_at_utc: '2026-09-02T22:00:42Z'
scope: anonymous_FRED_transport_headers_only_no_series_or_economic_change
research_only: true
live_trading_allowed: false

objective: >-
  Capture the same official FRED STLFSI4 fredgraph CSV after the former custom User-Agent
  was shown to time out at the CDN. Change only HTTP request headers, preserve the exact
  endpoint, query, parser, availability rule and component schema, and never use market
  or response values to select the route.

