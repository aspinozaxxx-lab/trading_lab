  parser_sha256: 7a6f5732743f12ad8ec9bfcc1fca5d9bbae6aedde41af1b07d2c8ea0cae5c32c

official_source:
  provider: Federal_Reserve_Bank_of_St_Louis_FRED
  endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv
  series_id: STLFSI4
  observation_lookback_days: 400
  query_fields: [id, cosd, coed]
  query_and_date_bounds_changed_from_parent: false
  parser_and_output_columns_changed_from_parent: false
  model_and_forward_availability_changed_from_parent: false

transport_diagnosis:
  diagnosed_at_utc: '2026-09-02T21:58:00Z'
  service_user: trading-lab
  prior_user_agent: market-lab-v27-forward-validation/2.0 (research)
  prior_result: repeatable_read_timeout_15_to_30_seconds
  candidate_user_agent: >-
    Mozilla/5.0 (compatible; MarketLabResearch/1.0;
    +https://github.com/aspinozaxxx-lab/trading_lab)
  candidate_result: HTTP_200
  candidate_response_bytes_in_transport_probe: 1108
  response_payload_values_read: false
  market_prices_returns_or_pnl_used: false

request_headers:
  User-Agent: >-
    Mozilla/5.0 (compatible; MarketLabResearch/1.0;
    +https://github.com/aspinozaxxx-lab/trading_lab)
  Accept: text/csv
  Accept-Encoding: identity
  Connection: close

retry:
