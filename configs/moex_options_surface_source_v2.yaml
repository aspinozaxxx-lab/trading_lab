  requested_dates_are_calendar_grid: true

source:
  provider: Moscow_Exchange_MOEX_ISS
  official_interface: https://www.moex.com/a8531
  endpoint: https://iss.moex.com/iss/history/engines/futures/markets/options/securities.json
  access_mode: public_delayed_exact_date_history
  bearer_token_required: false
  date_parameter: date
  asset_parameter: assetcode
  assets: [Si, RTS, BR, MIX]
  logical_mapping: {Si: SI, RTS: RI, BR: BR, MIX: MIX}
  cursor_block: history.cursor
  data_block: history
  pagination_start_parameter: start
  page_size: 100
  required_columns:
    - TRADEDATE
    - BOARDID
    - SECID
    - OPEN
    - LOW
    - HIGH
    - CLOSE
    - OPENPOSITIONVALUE
    - VALUE
    - VOLUME
    - OPENPOSITION
    - SETTLEPRICE
    - WAPRICE
    - CHANGE
    - QTY
    - NUMTRADES
    - THEOR_PRICE
  raw_response_bytes_url_hash_and_retrieval_required: true

selection:
  short_code_roots: [RI, MX, SI, BR]
  root_mapping: {RI: RI, MX: MIX, SI: SI, BR: BR}
  parser_implementation: market_lab.futures.moex_options_surface_source.parse_option_short_code
  official_short_code_fields: root_strike_settlement_option_month_year_optional_week
  exact_expiry_day_inference: forbidden
  server_asset_and_parsed_root_must_match: true
  unparsed_core_prefix_policy: fail_closed
  selection_uses_market_value_or_future_outcome: false

