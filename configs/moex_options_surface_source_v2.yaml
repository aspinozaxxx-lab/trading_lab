  conservative_available_at: next_calendar_date_00_00_Europe_Moscow
  admissible_join: source_date_strictly_before_decision_date
  same_day_signal_allowed: false
  historical_final_archive: true
  original_revision_vintage_proved: false
  corrections_may_exist: true

quality_gates:
