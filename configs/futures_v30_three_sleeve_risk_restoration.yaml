research_only: true
live_trading_allowed: false

development_selection:
  2012_2017_outcomes_observed_before_formula_freeze: true
  2008_2011_returns_or_pnl_observed: false
  independent_validation: false
  relationship_to_prior_work: >-
    V29 proved exact risk-first execution but the frozen V27 economics failed on
    2013-2017. V30 is a new target family selected on that now-open development period,
    not a threshold correction and not an independent result. It removes the macro cash
    governors, combines three bounded market mechanisms equally, and restores the final
    causal portfolio risk toward the original 20-percent target with a hard 2x ceiling.
  development_diagnostics_already_seen:
    - V29 per-asset and per-year exact PnL attribution
    - V12 one-times and two-times no-macro execution
    - bounded comparison of trend, carry, relative, breakout, consensus and corridor targets
    - leverage and final-volatility sensitivity
    - preliminary rolling, bootstrap and leave-one-year-out summaries
  corridor_result: >-
    The volatile-range corridor sleeve reduced development CAGR and Sharpe and was not
    retained. It remains a recorded negative result rather than a tunable V30 component.
  selection_bias_disclosed: true

hypothesis:
  statement: >-
    Equal exposure to absolute multi-horizon trend, the sign of the contemporaneously
    observable futures-curve carry, and cross-asset relative trend should diversify the
    single-regime dependence seen in V29. Restoring the already constructed portfolio's
    final expected volatility toward 20 percent, capped at 2x, should use quiet-state
    capacity without applying unconditional leverage in high-risk states.
  economic_mechanisms:
    - time_series_trend_captures_persistent_directional_risk_premia
    - curve_carry_captures_backwardation_or_contango_compensation
    - relative_trend_uses_the_full_cross_asset_snapshot_and_removes_common_direction
    - final_risk_restoration_is_continuous_causal_and_never_exceeds_2x
  primary_comparison: V12_1x_no_macro_replayed_on_same_open_development_period
  reject_if:
    - any_source_identity_causality_or_execution_check_is_false
    - any_main_cost_scenario_CAGR_is_below_20_percent
    - any_main_cost_scenario_MDD_exceeds_30_percent
    - primary_or_stress_Sharpe_is_below_1
    - fewer_than_four_primary_calendar_years_are_positive
    - robustness_gates_fail
  aspirational_50_percent_is_a_separate_reported_gate: true

