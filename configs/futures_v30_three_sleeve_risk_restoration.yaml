  relative_trend:
    formula: time_series_score_minus_finite_cross_asset_mean
    minimum_finite_assets: 2
    bounded_by_clipping: [-1.0, 1.0]
  relative_trend_transform: time_series_score_minus_finite_cross_asset_mean_clipped_minus1_plus1
