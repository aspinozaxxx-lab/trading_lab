coverage_contract:
  member_rule: exactly_one_safe_csv
  required_source_columns: ["#NAME", SMALL_NAME, TIME, S, A, B, C, D, E, T]
  assets: [RI, MIX, SI, BR]
  timezone: Europe/Moscow
  availability: event_at_plus_one_minute
  start: "10:10:00"
  end: "23:50:00"
  frequency_minutes: 10
  expected_grid_points_per_source_date: 83
  maximum_freshness_minutes: 20
  target_calendar_days: [30, 90]
  interpolation: same_asset_linear_in_effective_T
  extrapolation: forbidden
  nonpositive_T: preserved_but_ineligible

selection_gate:
  metric: complete_30d_90d_fraction_each_asset
  minimum_fraction: 0.85
  uses_prices_returns_targets_labels_or_pnl: false
  result_selects_only_source_periods_not_strategy_economics: true

output:
  directory: data/processed/options/moex-volatility-curve-archive-catalog-v1
  immutable: true
  overwrite_allowed: false
  raw_archives_in_git: false
  processed_values_in_git: false

forbidden_after_catalog:
  - carrying_a_snapshot_beyond_the_sealed_20_minute_freshness_window
  - selecting_periods_assets_or_sessions_by_market_returns_or_strategy_pnl
  - treating_curve_FUTURES_PRICE_as_an_executable_option_price
  - changing_the_coverage_gate_after_viewing_archive_coverage
  - reading_any_market_price_return_target_or_pnl_at_or_after_2026_01_01
  - live_trading_or_profit_guarantees

