protocol_id: moex_volatility_curve_archive_catalog_v1
protocol_version: 1
status: sealed_before_new_archive_bytes
declared_at_utc: "2026-09-01T20:30:00Z"
scope: source_schema_and_causal_coverage_only
research_only: true
live_trading_allowed: false

hypothesis:
  statement: >-
    Public MOEX volatility-curve archives with complete day and evening snapshots can
    support causal 30/90-day level, skew and curvature features for a new cross-market
    regime family; small or evening-only archives cannot.
  archive_selection_reads_market_returns_or_computes_pnl: false
  later_economic_test_requires_a_separate_sealed_protocol: true

