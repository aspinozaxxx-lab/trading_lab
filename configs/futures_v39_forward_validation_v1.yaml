protocol_id: futures_v39_forward_validation_v1
protocol_version: 1
status: sealed_after_v39_development_before_first_v39_forward_economic_observation
declared_at_utc: '2026-09-02T02:55:00Z'
research_only: true
live_trading_allowed: false

objective: >-
  Validate the frozen V39 option-open-interest tail governor on genuinely accumulated
  post-source-seal data without historical backfill, parameter changes, short-window
  annualization or option settlement fills.

development_candidate:
  protocol_path: configs/futures_v39_option_oi_tail_governor.yaml
  protocol_sha256: 3b5d3074f8ec93ffb3aa7170c332f19af7dcd55900a5f7902bc636dd595032a6
