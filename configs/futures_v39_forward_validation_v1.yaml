  root: data/forward/moex-options-surface-v1
  earliest_source_date: '2026-09-01'
  existing_snapshot_at_forward_protocol_seal: 1
  existing_snapshot_may_count_for_warmup_only: true
  evaluation_must_start_after_forward_protocol_seal_and_all_warmups: true
  every_snapshot_raw_replay_required: true
  all_four_assets_and_positive_call_put_OI_required: true
  source_date_and_actual_retrieval_required: true
  old_experiment_access: forbidden

futures_source:
  protocol_path: configs/futures_v27_forward_validation_v2.yaml
  protocol_sha256: f4a7d0166a47cf0b6eab8b8af87c5039dc6bb315f2097b46b627a1ca5047d932
  implementation_path: src/market_lab/futures/moex_v27_forward_validation_source.py
  implementation_sha256: f38a41f004bc3a1fd3dbb3a4d803c59e37ef51e8341f6251107c7a8c5bede79a
  root: data/forward/v27-validation-v2
  earliest_market_source_date: '2026-09-02'
  every_snapshot_raw_replay_required: true
  official_daily_CLOSE_only_for_signal: true
  current_LAST_or_SETTLE_as_close: forbidden

warmup:
  option_unique_weekly_levels_required: 54
  rationale: 54_levels_produce_current_change_plus_52_strictly_prior_changes
  futures_common_official_CLOSE_levels_required: 253
  futures_return_observations_required: 252
  warmup_returns_or_short_window_annualization_reported_as_result: forbidden
  historical_or_current_vintage_backfill: forbidden

evaluation:
  begins_only_after_both_warmups_complete: true
  minimum_futures_sessions: 504
  minimum_weekly_decisions: 104
  minimum_full_calendar_years: 2
  option_week_state_for_each_decision_required: true
  missing_or_stale_option_state: cash_affected_asset
  observed_futures_quote_paper_execution_required: true
  option_execution_not_required_because_options_are_not_traded: true

promotion_gates:
  all_cost_scenario_CAGR_minimum: 0.20
  primary_sharpe_minimum: 1.0
  maximum_drawdown_maximum: 0.30
  positive_full_years_minimum: 2
  worst_full_year_minimum: 0.0
  critical_failures_maximum: 0
  unresolved_halts_maximum: 0
  option_and_futures_source_audits_all_true: true
  observed_quote_paper_profit_positive: true
  second_unseen_confirmation_required_after_numeric_pass: true
  live_trading_allowed_after_first_pass: false

readiness:
  module: market_lab.futures.v39_forward_validation_readiness
  computes_signal_or_pnl: false
  counts_only_raw_replay_valid_unique_dates_weeks_and_snapshot_kinds: true

forbidden_after_forward_outcomes:
  - changing_52_window_or_10_90_quantiles
  - changing_sign_direction_scale_warmup_or_staleness
  - selecting_option_strikes_maturities_week_codes_assets_or_activity_filters
  - switching_to_option_volume_or_prices_after_result
  - backfilling_2026_or_preseal_market_or_option_states
  - changing_V27_signal_leverage_costs_collateral_capacity_or_execution
  - reporting_CAGR_before_504_evaluation_sessions_and_two_full_years
  - live_trading_before_second_unseen_confirmation_and_broker_exact_audit

outputs:
  readiness_only_until_warmup_complete: true
  paper_root: runs/v39-forward-validation-v1
  contents_in_git: false
