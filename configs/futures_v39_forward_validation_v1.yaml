  identity_sha256: fe60f262ed752935be7eb52618bdb3759de709b0f4a1507e86f7f131d2af0c71
  development_primary: {cagr: 0.28684921591536106, sharpe: 1.2514786952301653, maximum_drawdown: 0.20032190791720583}
  development_is_not_forward_evidence: true

frozen_economics:
  parent_signal: byte_identical_V27
  universe: [SI, RI, BR, MIX]
  option_state: aggregate_open_interest_over_all_strikes_maturities_and_week_codes
  put_share: put_OI_divided_by_call_plus_put_OI
  option_state_used_by_decision: latest_completed_week_strictly_before_decision_week
  current_change: selected_put_share_minus_prior_selected_put_share
  prior_changes_window: 52
  lower_quantile: 0.10
  upper_quantile: 0.90
  quantile_method: linear
  long_cash_rule: current_change_strictly_above_prior_q90
  short_cash_rule: current_change_strictly_below_prior_q10
  equality_and_directionally_compatible_rule: pass
  scale_values: [0.0, 1.0]
  option_orders: forbidden
  futures_leverage_costs_collateral_capacity_and_execution: byte_identical_V27_V39

option_source:
  protocol_path: configs/moex_forward_option_surface_source_v1.yaml
  protocol_sha256: a33c86b4440a0c14fceac4c5a2e3bdd580e3ff9964bfcb375a4ba09f83529eaa
  implementation_path: src/market_lab/futures/moex_forward_option_surface_source.py
