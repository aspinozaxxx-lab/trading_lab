protocol_id: futures_v25_stlfsi_stress_governor_v1
protocol_version: 1
status: predeclared_before_v25_oos_outcomes
declared_at_utc: "2026-09-01T04:43:58Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
relationship_to_prior_work: >-
  Adaptive same-period stability hypothesis declared after V12 and V24 outcomes were
  observed. V25 preserves byte-identical V12 signal, weekly portfolio construction,
  risk budget, exact execution and costs. It applies one weekly binary global risk
  governor from the latest causally available STLFSI4 observation. It does not reuse or
  retune the failed V24 VIX/VIX3M state and is not an independent holdout.

parent_v12:
  protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
  metrics_sha256: c989377f7de65c3ef0a8dd52a1f5fcbf11c6ad8048119ea0a7b4402f47b23288
  primary_reference:
    total_return: 0.451113922334873
    cagr: 0.07731837008966158
    sharpe: 0.7624477569712388
    maximum_drawdown: 0.14152584161232418
    positive_years: 4
    worst_year: -0.026317846517727284
    total_cost_rub: 13387.28160116245

source_commit: cdfe674

hypothesis:
  statement: >-
    A low-turnover weekly global risk-off switch using the official STLFSI4 structural
    zero can improve frozen V12 Sharpe and maximum drawdown while retaining at least 5
    percent CAGR and positive doubled/stress exact-execution returns.
  economic_mechanism:
    - STLFSI4_aggregates_18_weekly_financial_market_stress_series
    - official_zero_represents_normal_financial_market_conditions
    - positive_values_represent_above_average_financial_market_stress
    - weekly_application_avoids_the_daily_churn_observed_in_V24
    - the_governor_never_increases_frozen_V12_risk
  primary_comparison: frozen_v12_primary_reference_above
  reject_if:
    - any_input_identity_raw_replay_schema_temporal_or_availability_check_fails
    - sealed_weekly_state_counts_do_not_match
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_cagr_is_below_0_05
    - primary_sharpe_or_drawdown_does_not_improve_on_frozen_v12
    - fewer_than_4_of_5_calendar_years_are_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_the_zero_boundary_or_maximum_age
    - using_the_observation_before_following_Thursday_end
    - adding_levels_percentiles_changes_smoothing_hysteresis_or_partial_scaling
    - changing_V12_signal_portfolio_execution_or_costs
    - inverting_the_governor_or_tuning_asset_specific_exceptions
    - combining_V24_and_V25_states_by_observed_metrics
    - treating_current_version4_history_as_independent_holdout_or_live_evidence

