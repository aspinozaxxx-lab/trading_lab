protocol_id: futures_v14_rvi_risk_governor_v1
protocol_version: 1
status: predeclared_before_v14_oos_outcomes
declared_at_utc: "2026-08-31T19:25:33Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
relationship_to_prior_work: >-
  Adaptive same-period stability hypothesis declared after V12 and V13 outcomes were
  observed. V14 preserves byte-identical V12 signal, portfolio construction and exact
  execution, then only scales weekly risk downward using the strictly previous core-four
  session's official RVI close. It is not an independent holdout.

