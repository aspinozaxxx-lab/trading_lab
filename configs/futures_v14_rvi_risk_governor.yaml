  protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
  metrics_sha256: c989377f7de65c3ef0a8dd52a1f5fcbf11c6ad8048119ea0a7b4402f47b23288
  primary_reference:
    total_return: 0.451113922334873
    cagr: 0.07731837008966158
    sharpe: 0.7624477569712388
    maximum_drawdown: 0.14152584161232418
    positive_years: 4
    worst_year: -0.026317846517727284
    total_cost_rub: 13387.28160116245

hypothesis:
  statement: >-
    A forward-looking implied-volatility governor based on strictly lagged MOEX RVI can
    improve V12 Sharpe and maximum drawdown while retaining at least 5 percent CAGR and
    positive doubled/stress exact-execution returns.
  economic_mechanism:
    - option_implied_volatility_can_warn_about_tail_risk_before_realized_volatility
    - proportional_downscaling_avoids_binary_threshold_search
    - the_governor_never_increases_frozen_v12_risk
  primary_comparison: frozen_v12_primary_reference_above
  reject_if:
    - any_input_identity_schema_temporal_or_rvi_availability_check_fails
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_cagr_is_below_0_05
    - primary_sharpe_or_drawdown_does_not_improve_on_frozen_v12
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_the_warmup_statistic_or_rvi_mapping
    - adding_an_rvi_threshold_floor_ceiling_or_same_day_value
    - changing_v12_trend_portfolio_execution_or_costs
    - blending_v12_v13_v14_by_observed_metrics
    - treating_v14_as_independent_holdout_or_live_evidence

