risk_governor:
  id: prior_session_rvi_proportional_downscale
  calibration_start: "2018-01-03"
  calibration_end: "2020-12-31"
  calibration_rows: 756
  calibration_statistic: median_of_official_rvi_daily_close
  frozen_rvi_median: 24.134999999999998
  source_value: exact_previous_factual_core4_panel_session_rvi_close
  formula: min(1.0, frozen_rvi_median / previous_session_rvi_close)
  lower_floor: none
  upper_cap: 1.0
  application: multiply_all_four_post_v12_weekly_target_weights_before_execution_mapping
  missing_policy: risk_scale_missing_and_all_four_target_weights_cash
  scale_can_increase_v12_risk: false
  variants_after_outcome: forbidden

portfolio:
  implementation_contract: futures_causal_risk_portfolio_v1_byte_reused_from_v12
  decision_schedule: last_factual_session_of_each_W_SUN_week
  mandatory_additional_decisions: any_known_active_contract_change_for_a_nonzero_held_target
  signal_weight_between_weekly_decisions: carry_last_governed_weekly_target
  ewma_volatility_span_sessions: 20
  covariance_lookback_sessions: 60
  covariance_assets: [SI, RI, BR, MIX]
  annual_target_volatility_before_governor: 0.20
  gross_cap: 1.0
  turnover_sleeves: 5
  sleeve_unit: weekly_rebalance_decisions
  risk_scaling: v12_only_downward_then_rvi_only_downward
  target_missing_policy: zero_weight_for_that_asset

execution:
  initial_cash_rub: 1000000.0
  decision_to_fill: next_factual_effective_date_open
  integer_quantity: truncate_toward_zero_weight_times_current_cash_over_lagged_notional
  active_contract: exact_contract_known_at_decision_from_active_contract_map
  roll: explicit_old_exit_plus_new_entry_at_same_factual_open
  execution_atomicity: asset
  maximum_participation: 0.01
  participation_denominator: immediately_prior_factual_contract_volume
  maximum_gross_notional_multiple: 1.0
  initial_margin: modeled_25_percent_of_lagged_notional
  initial_margin_buffer_multiple: 2.0
  settlement_accounting: factual_variation_margin_with_open_gap_and_settlement_mark
  collateral_yield: 0.0
  terminal_policy: carry_with_terminal_positions_and_cost_limitation_reported
  missing_or_unprovable: reject_or_unresolved_never_zero_return
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}
  limitations:
    rvi_historical_revision_exact: false
    historical_exchange_exact: false
    broker_exact: false
    queue_and_bid_ask_exact: false
    point_value_fee_and_margin: frozen_conservative_research_proxy

