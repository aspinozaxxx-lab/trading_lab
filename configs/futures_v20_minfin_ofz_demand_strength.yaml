protocol_id: futures_v20_minfin_ofz_demand_strength_v1
protocol_version: 1
status: sealed_before_any_v20_market_outcome_read
declared_at_utc: "2026-09-01T01:25:39Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
relationship_to_prior_work: >-
  New current-vintage information family from official Ministry of Finance OFZ auction
  result records. The 2021-2025 RI/MIX/SI outcomes were seen in unrelated experiments,
  source pages were retrieved later, and exact historical publication times are absent;
  therefore V20 is development evidence, not independent holdout confirmation.

hypothesis:
  statement: >-
    Strong demand and large accepted placement in successful fixed-coupon OFZ-PD auctions
    indicate lower domestic risk premium and stronger ruble liquidity. Relative to only
    prior auction days, strength is long RI and MIX and short SI; weakness takes the
    symmetric opposite basket.
  economic_mechanism:
    - bid_to_cover_measures_demand_relative_to_accepted_primary_supply
    - placed_volume_requires_strength_to_include_actual_absorption_not_only_unaccepted_bids
    - fixed_coupon_OFZ_PD_is_selected_before_outcomes_as_the_cleanest_rate_risk_family
    - stronger_domestic_duration_demand_is_risk_on_for_RI_MIX_and_ruble_positive_for_SI
    - the_result_day_is_never_filled_before_the_next_factual_open
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_is_not_changed_or_combined_in_this_run
  reject_if:
    - any_source_identity_schema_or_temporal_check_fails
    - any_successful_OFZ_PD_primary_result_has_missing_or_nonpositive_demand_or_placement
    - any_current_auction_value_enters_its_own_rank_history
    - any_result_is_used_before_end_of_its_printed_publication_day
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - inverting_any_asset_sign
    - changing_the_26_day_history_or_13_day_minimum
    - selecting_a_score_threshold_or_only_extreme_auctions
    - adding_failed_supplemental_corrected_PK_or_IN_events_based_on_v20_metrics
    - changing_equal_risk_budgets_volatility_target_floor_or_seven_day_expiry
    - changing_to_same_day_fill_or_using_a_publication_time_not_printed_by_the_source
    - combining_with_V12_or_other_signals_based_on_v20_metrics
    - presenting_current_vintage_history_as_original_publication_vintages

