hypothesis:
  statement: >-
    A repeatedly refreshed nonlinear forecast of the next sixty-minute open-to-open
    returns, trained on simultaneous SI, RI, BR and MIX state plus the same-day robust
    cross-asset MOEX option-coefficient regime, can identify sparse opportunities whose
    net portfolio return is stable across calendar segments and survives conservative
    costs better than both a market-only neural ablation and a linear full-feature model.
  aggressive_elements:
    - a new decision after every completed ten-minute bucket
    - simultaneous four-market state rather than an isolated instrument
    - nonlinear cross-market interactions
    - thirty-percent annual volatility target with 1.6x gross cap
  no_sign_inversion_after_observation: true
  no_model_or_architecture_search_inside_reported_test_months: true

