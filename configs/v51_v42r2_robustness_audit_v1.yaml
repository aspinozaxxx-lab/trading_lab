objective: >-
  Test whether every one of the nine already observed V42R2 market-cost curves retains
  internal support for at least 20% CAGR under fixed block-resampling, rolling-window
  and leave-one-year-out diagnostics. Report 50% only as aspirational context.

relationship_to_prior_work: >-
  V42R2 is the strongest same-history stability portfolio but is not independent and
  has no broker-exact forward fills. V51 cannot select a fund or cost scenario, change
  the 80/20 allocation, retune V39, or modify any execution, yield or cost assumption.

