hypothesis:
  statement: >-
    An atomic roll must not retain a soon-expiring old contract merely because the new
    contract cannot accept the full desired entry. If the old leg has a factual open and
    full exit fits the unchanged one-percent lagged-volume cap, exit it completely and
    independently clip the new entry to its own one-percent capacity, including zero/cash.
    This can remove V28's expired-contract trap without increasing signal risk, leverage,
    participation, or optimistic fill assumptions.
  primary_comparison: canonical_invalid_V28_parent
  economic_mechanism:
    - liquidation_risk_has_priority_over_desired_new_exposure
    - old_exit_and_new_entry_have_independent_liquidity_constraints
    - insufficient_new_liquidity_reduces_exposure_instead_of_extending_expiry_risk
  reject_if:
    - any_parent_identity_source_or_temporal_check_fails
    - any_old_exit_exceeds_one_percent_capacity
    - any_critical_failure_or_unresolved_halt_remains
    - any_cost_scenario_CAGR_is_below_20_percent
    - any_cost_scenario_MDD_exceeds_30_percent

