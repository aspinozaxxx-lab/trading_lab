relationship_to_prior_work: >-
  V39 preserves the frozen V27 signal, STLFSI4 and key-rate governors, exact 2x
  leverage, RUONIA collateral, capacity policy, futures execution and costs. It adds
  one asset-specific veto from lagged aggregate option open-interest composition.
  Options are never traded and settlement prices are never treated as fills.

