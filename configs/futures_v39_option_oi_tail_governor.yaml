hypothesis:
  statement: >-
    An unusually large weekly increase in an asset's aggregate put share of option open
    interest can identify a left-tail hedge-demand shock and veto only a frozen-V27
    long. A symmetric unusually large decrease can identify call-side pressure and veto
    only a short. Non-extreme and directionally compatible states pass unchanged.
  economic_mechanism:
    - aggregate_all_strikes_maturities_and_week_codes_without_selection
    - use_open_interest_composition_not_option_execution_prices
    - compare_scale_free_weekly_put_share_changes_with_own_trailing_history
    - veto_only_a_direction_exposed_to_the_detected_tail_pressure
    - never_increase_or_reverse_the_parent_target
  primary_comparison: frozen_V27_scenario_references

dates:
  source_start: '2021-01-08'
  oos_start: '2021-01-01'
  oos_end: '2025-12-31'
  forbidden_from: '2026-01-01'
  timezone: Europe/Moscow

universe:
  exact_order: [SI, RI, BR, MIX]
  option_asset_mapping: {SI: SI, RI: RI, BR: BR, MIX: MIX}

information_set:
  decision_at: 23_59_59_Europe_Moscow_on_each_frozen_V27_weekly_decision_date
  source_state_selection: latest_source_date_strictly_before_decision_date
  maximum_selected_state_age_calendar_days: 10
  state_aggregation: sum_nonnegative_OPENPOSITION_by_asset_option_type_over_all_rows
  put_share_formula: put_open_interest_divided_by_call_plus_put_open_interest
  weekly_change: selected_put_share_minus_put_share_selected_at_previous_parent_decision
  baseline_observations: 52
  baseline_contains_only_changes_strictly_before_current_change: true
  quantile_method: linear
  lower_quantile: 0.10
  upper_quantile: 0.90
  warmup_policy_before_52_prior_changes: pass_parent_unchanged
  unexpected_missing_or_stale_after_warmup: cash_asset
  no_zero_imputation: true

option_oi_governor:
  id: lagged_weekly_option_put_share_tail_direction_veto
  long_cash_condition: parent_target_positive_and_current_change_strictly_above_trailing_q90
  short_cash_condition: parent_target_negative_and_current_change_strictly_below_trailing_q10
  equality_policy: pass
  neutral_parent_target_policy: remain_zero
  non_extreme_or_directionally_compatible_policy: pass
  admitted_scale: 1.0
  cash_scale: 0.0
  application: multiply_each_frozen_V27_asset_target_before_exact_2x
  scale_can_increase_parent_risk: false
  global_cross_asset_cash_switch: false
  option_trade_created: false
  strike_maturity_week_or_activity_filter: none

capital_execution_and_costs:
  inherited_byte_identical_from_V27: true
  target_weight_multiplier_after_all_governors: 2.0
  maximum_gross_notional_multiple: 2.0
  initial_margin_buffer_multiple: 2.0
  collateral_RUONIA_fraction: 0.50
  operational_buffer_fraction: 0.10
  scenarios:
