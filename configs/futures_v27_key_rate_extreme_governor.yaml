hypothesis:
  statement: >-
    When the latest conservatively available official CBR key rate is at least 20
    percent per annum, moving the already-STLFSI4-governed portfolio fully to cash
    before applying the otherwise unchanged 2x multiplier can retain at least 20
    percent combined CAGR in all three cost scenarios while reducing every scenario
    maximum drawdown to at most 30 percent.
  economic_mechanism:
    - a_20_percent_policy_rate_is_an_extreme_round_monetary_restriction_boundary
    - extreme_cash_yield_competes_with_risky_trend_exposure
    - high_discount_rates_and_tight_liquidity_can_destabilize_equity_currency_and_oil_trends
    - cash_state_still_earns_the_sealed_haircutted_causal_RUONIA_on_eligible_collateral
    - the_governor_can_only_reduce_never_increase_V26_risk
  primary_comparison: sealed_V26_primary_combined_reference
  reject_if:
    - any_parent_input_raw_replay_schema_temporal_availability_or_accrual_check_fails
    - exact_predeclared_weekly_combined_state_counts_do_not_match
    - any_critical_execution_failure_or_unresolved_halt_remains
    - any_primary_doubled_or_stress_combined_cagr_is_below_0_20
    - any_primary_doubled_or_stress_combined_maximum_drawdown_exceeds_0_30
    - primary_combined_sharpe_is_below_sealed_V26_primary
    - primary_combined_worst_year_is_worse_than_sealed_V26_primary
    - primary_combined_positive_years_are_below_4_of_5
    - any_order_time_gross_participation_or_margin_limit_is_breached
  forbidden_followups_on_same_2021_2025_outcomes:
    - changing_20_percent_boundary_or_seven_day_maximum_age
    - using_same_day_key_rate_before_the_conservative_next_day_boundary
    - changing_cash_state_to_partial_scaling_after_observing_results
    - changing_2x_leverage_RUONIA_haircut_buffer_or_capacity_policy
    - combining_key_rate_with_other_CBR_thresholds_selected_by_V27_outcomes
    - accepting_less_than_20_percent_or_more_than_30_percent_drawdown_after_a_near_miss
    - treating_v27_as_independent_holdout_or_live_evidence

