relationship_to_prior_work: >-
  Adaptive same-period stability hypothesis declared after V26 achieved more than
  20 percent CAGR in every cost scenario but exceeded its 30 percent drawdown cap.
  V27 keeps the sealed V26 maximum 2x risk, V25 STLFSI4 state, RUONIA treatment,
  capacity policy and all costs unchanged. It adds one binary official CBR key-rate
  governor before the 2x multiplier. It is not independent holdout confirmation.

