protocol_id: v52_ofz_carry_roll_down_v1
protocol_version: 1
status: sealed_before_any_ofz_market_value_return_or_pnl
declared_at_utc: '2026-09-02T17:25:00Z'
research_only: true
independent_return_engine: true
live_trading_allowed: false

hypothesis: >-
  A causal monthly portfolio of three liquid fixed-coupon OFZ-PD issues with two to
  seven years remaining maturity and the highest prior YIELDATWAP can earn carry and
  roll-down with lower drawdown and lower dependence on the frozen V49 futures engine.
  A predeclared 85/15 fully-funded buy-and-hold sleeve mix may improve stability while
  retaining materially more than twenty percent historical CAGR.

selection:
  candidate_count: 1
  universe_security_id_prefix: SU262
  currency_id: RUB
  face_unit: RUB
  minimum_remaining_maturity_years: 2.0
  maximum_remaining_maturity_years: 7.0
  trailing_liquidity_observations: 20
  trailing_window_includes_decision_session: true
  minimum_trailing_median_value_rub: 10000000.0
  ranking_field: yield_at_wap_pct
  ranking_direction: descending
  selected_security_count: 3
  target_weights: equal
  decision: last_factual_TQOB_session_of_each_calendar_month_after_close
  require_candidate_row_on_decision_session: true
  tie_break: security_id_ascending
  change_threshold_duration_top_count_weight_or_rebalance_day_after_outcome: forbidden

execution:
  initial_cash_rub: 1000000.0
  fractional_bond_proxy: true
  historical_lot_size_proven: false
  order_time: first_common_subsequent_factual_session_with_positive_OPEN_for_all_old_and_new
  maximum_execution_delay_calendar_days: 10
  missing_common_execution: sleep_and_keep_existing_positions
  rebalance_method: exact_target_weight_delta_after_cost_fixed_point
  maximum_fixed_point_iterations: 100
  fixed_point_tolerance_rub: 1.0e-08
  dirty_price_formula: clean_percent_times_face_divided_by_100_plus_accrued_interest
  close_mark_priority: [close_clean_pct, wap_clean_pct, legal_close_clean_pct]
  missing_held_mark: unresolved_no_forward_fill
  coupons_and_amortization: explicit_bondization_only
  entitlement: quantity_held_after_close_of_latest_factual_session_on_or_before_explicit_record_date
  cashflow_credit_date: first_factual_session_on_or_after_explicit_event_date
  missing_record_date_event_date_or_value: unresolved
  terminal_positions: mark_not_liquidate

cost_scenarios:
