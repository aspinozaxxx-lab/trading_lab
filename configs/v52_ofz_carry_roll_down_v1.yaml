limitations:
  - Daily MOEX history has no executable bid/ask, depth, queue or broker fills.
  - Fractional bonds are a sizing proxy because historical LOTSIZE is not pinned.
  - Bondization is current-vintage and is used only to reconstruct explicit cashflows.
  - The V49 sleeve is same-history selected and this portfolio is not a holdout.
  - Tax, broker fees, settlement cash timing and collateral eligibility are unproved.
  - A pass cannot promise future returns and cannot authorize live trading.

forbidden_followups:
