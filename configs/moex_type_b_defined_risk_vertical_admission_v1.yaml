observation_grid:
  timezone: Europe/Moscow
  source_trade_date: '2024-10-01'
  previous_evening_first: '2024-09-30T19:10:00+03:00'
  previous_evening_last: '2024-09-30T23:50:00+03:00'
  main_first: '2024-10-01T07:10:00+03:00'
  main_last: '2024-10-01T18:40:00+03:00'
  frequency_minutes: 10
  bbo_state_must_be_strictly_before_grid_timestamp: true
  no_cross_date_state_carry: true

freshness_sensitivity_seconds: [1, 5, 15, 60]

pair_construction:
  same_logical_asset: true
  same_option_type: true
  same_encoded_expiry_month_year_and_week: true
  strikes: adjacent_distinct_only
  calls: buy_lower_strike_at_offer_sell_higher_strike_at_bid
  puts: buy_higher_strike_at_offer_sell_lower_strike_at_bid
  both_legs_two_sided_and_not_locked_or_crossed: true
  all_four_side_ages_lte_sensitivity_bucket: true
  net_debit_must_be_strictly_positive: true
  net_debit_must_be_strictly_less_than_strike_width: true
  maximum_loss_is_entry_debit_before_fees: true
  maximum_payoff_is_strike_width_before_fees: true
  naked_short_options: forbidden
  simultaneous_fill_assumed: false

reported_only:
  grid_timestamp_count: true
  identity_and_pair_counts_by_asset: true
  fresh_two_sided_leg_counts_by_age_bucket: true
  admissible_vertical_counts_by_asset_type_and_age_bucket: true
  timestamps_with_at_least_one_admissible_vertical: true
  quote_volumes_available: true
  returns_labels_targets_predictions_trades_positions_equity_pnl: forbidden

admission:
  all_parent_hashes_and_audits_exact: true
  grid_predeclared: true
  strict_prior_asof_join: true
  no_same_timestamp_state: true
  exact_prior_identity_only: true
  every_pair_same_expiry_and_adjacent_strike: true
  no_negative_or_zero_debit: true
  no_debit_ge_strike_width: true
  deterministic_replay_exact: true
  forbidden_outputs_absent: true

outputs:
  root: data/processed/options/moex-type-b-defined-risk-vertical-admission-2024-10-01-v1
  pair_inventory: pair_inventory.parquet
  grid_leg_states: grid_leg_states.parquet
  opportunities: vertical_opportunities.parquet
  metrics: structural_metrics.json
  manifest: manifest.json
  audit: audit.json
  immutable: true
  git_allowed: false

limitations:
  - One sample date can validate structure and scale, not profitability or stability.
  - A two-leg quote is not an atomic fill; long leg must fill before any short leg.
  - Fees, exercise, assignment, margin, latency and broker rules are not modeled here.
  - Economic rules require a separate seal and additional independent dates.
