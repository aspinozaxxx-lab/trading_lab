scope: source_only_defined_risk_vertical_structural_admission
research_only: true
live_trading_allowed: false

objective: >-
  Determine whether the official Type B sample contains enough strictly-prior,
  non-crossed, fresh two-sided BBO states to form same-expiry adjacent-strike debit
  verticals on SI, RI, BR and MIX. Count structural opportunities only; never PnL.

