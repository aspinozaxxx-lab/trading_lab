    - IMOEX
    - RVI
    - RGBI
    - CNYRUB_TOM
  news: false
  ticker_embedding: false

model:
  family: causal_multi_resolution_tcn
  daily_sequence_sessions: 128
  intraday_context_sessions: 5
  seeds:
    - 11
    - 23
    - 42
    - 71
    - 101
  ensemble: arithmetic_mean_without_seed_selection
  primary_loss: cross_sectional_residual_ranking

portfolio:
  staggered_sleeves: 5
  stock_gross_leverage: 1.0
  long_top_k: 3
  long_keep_rank: 6
  maximum_stock_weight: 0.40
  maximum_sector_weight: 0.50
  volatility_target_annual: 0.12
  beta_target_range:
    - -0.10
    - 0.10
  diagnostic_long_short: true
  commission_bps: 5.0
  slippage_bps: 2.0
  missing_exit_policy: carry_to_first_real_open

development_folds:
  - train: 2018-2020
    inner: 2021
    outer: 2022
  - train: 2018-2021
    inner: 2022
    outer: 2023
  - train: 2018-2022
    inner: 2023
    outer: 2024
  - train: 2018-2023
    inner: 2024
    outer: 2025

pre_holdout_gates:
  minimum_mean_rank_ic: 0.03
  minimum_positive_ic_folds: 3
  fold_count: 4
  minimum_aggregate_net_sharpe: 1.0
  minimum_median_fold_sharpe: 0.8
  minimum_worst_fold_sharpe: -0.25
  maximum_drawdown: 0.20
  require_positive_double_cost_return: true
  require_positive_delayed_entry_return: true
  maximum_participation_of_lagged_value: 0.01
  require_zero_synthetic_executions: true

holdout_gates:
  minimum_mature_rank_ic: 0.02
  minimum_net_sharpe: 0.75
  maximum_drawdown: 0.20
  require_positive_net_cagr: true
  require_positive_double_cost_return: true
  require_zero_synthetic_executions: true

stretch_gate:
  minimum_core_cagr: 0.50
  minimum_sharpe: 1.50
  maximum_drawdown: 0.25
  require_positive_double_cost_return: true

holdout_access_rule: >-
  Download and return access is forbidden until the exact feature pipeline, model
  ensemble, portfolio rule, development results and their hashes are sealed. After
  that seal, one evaluation of the frozen asset holdout is allowed.
