protocol_id: moex_forward_option_surface_intraday_admission_v1
protocol_version: 1
status: sealed_before_first_high_frequency_snapshot_after_boundary
declared_at_utc: '2026-09-02T20:05:00Z'
scope: forward_source_only_no_signal_no_label_no_pnl
research_only: true
live_trading_allowed: false

objective: >-
  Accumulate a new point-in-time intraday MOEX option-surface history for discovering
  defined-risk volatility, skew, term-structure and cross-asset timing hypotheses that
  cannot be evaluated from one end-of-day snapshot. No economic outcome is computed by
  this protocol.

parent_source:
  config_path: configs/moex_forward_option_surface_source_v1.yaml
  config_sha256: a33c86b4440a0c14fceac4c5a2e3bdd580e3ff9964bfcb375a4ba09f83529eaa
  implementation_path: src/market_lab/futures/moex_forward_option_surface_source.py
  implementation_sha256: 6b844b8a39724f9c6920e5993c9bfd0b161d78399c9b98e35b42f8fbd96c4fde
  output_root: data/forward/moex-options-surface-v1
  existing_snapshot_count_at_declaration: 1
  existing_snapshots_counted_for_intraday_admission: false

forward_boundary:
  earliest_eligible_retrieved_at_utc: '2026-09-02T20:05:00Z'
  historical_or_2026_backfill_counted: false
  source_date_without_post_boundary_retrieval_is_eligible: false

schedule:
  timezone: Europe/Moscow
  weekdays: [Mon, Tue, Wed, Thu, Fri]
  regular_grid: '10:09_through_22:59_every_10_minutes'
  late_grid: ['23:09', '23:19', '23:29', '23:39', '23:55']
  maximum_expected_gap_minutes: 16
  persistent_catchup: false
  single_authoritative_host: gpu-mlserver
  local_windows_tasks_enabled: false

session_admission:
  minimum_valid_snapshots: 30
  minimum_retrieval_span_minutes: 300
  maximum_gap_minutes: 25
  every_snapshot_parent_raw_replay_required: true
  all_four_assets_required_per_snapshot: true
  invalid_snapshot_invalidates_only_itself: true
  incomplete_session_is_warmup_but_not_complete: true

sequential_phases:
  discovery_complete_sessions: 20
  calibration_complete_sessions: 20
  unseen_evaluation_complete_sessions: 60
  economic_protocol_may_be_sealed_only_after_discovery: true
  calibration_or_evaluation_backfill: forbidden

future_hypothesis_comparisons_fixed_before_values:
  full_surface_neural_timing: true
  price_only_underlying_ablation: true
  fixed_skew_term_structure_rule: true
  always_abstain: true
  defined_risk_spreads_only: true
  naked_short_options: forbidden
  entry_requires_later_observed_offer: true
  exit_requires_later_observed_bid: true
  public_delayed_BBO_is_not_realtime_queue_or_fill_proof: true

forbidden_outputs:
  - return
  - label
  - target
  - prediction
  - trade
  - position
  - equity
  - pnl

outputs:
  readiness_module: market_lab.futures.forward_option_intraday_readiness
  shared_parent_snapshot_root: data/forward/moex-options-surface-v1
  economic_output: none_until_separate_post_discovery_seal

limitations:
  - Anonymous ISS quotes are delayed and do not prove realtime latency, queue or fill.
  - Repeated snapshots can share a source date and cumulative activity fields.
  - Twenty discovery sessions are for schema and state design, not performance selection.
  - Even a future unseen paper pass cannot guarantee 20% or authorize live trading.
