protocol_name: stocks-v37-cross-market-breakout
protocol_version: 37
declared_at_utc: '2026-09-02T00:59:22Z'
research_status: predeclared_before_v37_targets_or_pnl_no_2026_no_live
sealed_before_outcomes: true
research_only: true
live_trading_allowed: false

objective:
  hypothesis: >-
    A new intraday high or low that follows a six-bar directional build-up, broad
    confirmation across all thirty liquid stocks and high relative traded value has
    continuation persistence. A full cross-stock neural gate can reject false
    breakouts better than an aggregate-only gate while a trailing profit corridor
    harvests volatile moves and a distant stop limits failed regimes.
  distinction_from_v35: >-
    V35 traded six-stock residual mean reversion for an exact sixty-minute horizon.
    V37 trades one-sided three-stock Donchian continuation with a path-dependent
    trailing exit, distant stop and expanding all-market state. It does not invert the
    V35 residual score, threshold or label.
  primary_comparison: full_cross_stock_mlp_vs_aggregate_only_mlp_vs_ungated_breakout
  reject_if: primary_or_doubled_cagr_below_20_percent_or_instability_gate_fails

source:
  directory: data/processed/stocks_10m_pre2026_v1
  manifest_path: data/processed/stocks_10m_pre2026_v1/manifest.json
  manifest_sha256: 5a7a4873f01141682c9c53d0714d235187eec6b57e5449b23bb04e68c4593042
  manifest_bytes: 15515
  source_loader: src/market_lab/stocks/cross_sectional_intraday.py
  source_loader_sha256: f31e0b80b69bbb58ec93125ae3738782a143d82faa8153c0adf45ad5f267a230
  expected_rows: 4527436
  expected_tickers: 30
  minimum_timestamp_utc: '2018-01-03T06:50:00Z'
  maximum_timestamp_utc: '2025-12-30T20:40:00Z'
  protected_2026_read_allowed: false
  required_columns: [open, high, low, close, volume, value, timestamp]

