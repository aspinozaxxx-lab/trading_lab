    - TATN
    - TATNP
    - TRNFP
    - VTBR
  synchronization: exact_common_thirty_asset_timestamps
  survivorship_disclosure: fixed_current_development_universe_not_point_in_time_constituents
  missing_asset_policy: no_candidate

timing:
  timezone: Europe/Moscow
  source_timestamp_semantics: ten_minute_bar_open
  decision: after_source_bar_close
  decision_local_time_start: '11:00:00'
  decision_local_time_end: '17:00:00'
  decision_stride_bars: 1
  entry: next_exact_common_bar_open
  maximum_holding_bars: 24
  exit_trigger: completed_bar_close_then_next_exact_common_open
  forced_exit_local_open: '18:30:00'
  overnight_positions: forbidden
  maximum_concurrent_baskets: 1
  purge_sessions: 1

candidate:
  lookback_exact_same_session_bars: 6
  breakout_fraction_beyond_prior_high_or_low: 0.0015
  direction_build_up_return_bars: 3
  direction_build_up_sign_must_match: true
  breadth_confirmation_fraction: 0.60
  selected_leg_count: 3
  selected_direction: strongest_confirmed_side
  selected_minimum_cross_sectional_value_rank: 0.50
  minimum_available_assets: 30
  same_ticker_duplicate_forbidden: true
  one_sided_equal_notional_basket: true
  simultaneous_long_and_short_legs: false

features:
  same_session_exact_predecessors_only: true
  per_stock_blocks:
    - log_return_1_bar
    - log_return_3_bars
    - log_return_6_bars
    - donchian_breakout_fraction
    - cross_sectional_log_value_rank
    - trailing_36_bar_correlation_to_equal_weight_market
  aggregate_blocks:
    - equal_weight_market_returns_1_3_6
    - positive_breadth_1_3_6
    - cross_sectional_return_dispersion_1_3_6
    - mean_and_max_breakout_strength_by_side
    - mean_pairwise_correlation_proxy
    - selected_leg_value_and_volatility_statistics
    - causal_time_of_day_sine_cosine
  correlation_lookback_bars: 36
  correlation_minimum_bars: 24
  normalization: train_fold_standard_scaler_only
  finite_clipping: 8.0
  missing_feature_policy: train_median_plus_missing_indicator
  forbidden_features: [future_price, future_return, target, label, pnl, year_identity]

exit:
  hard_stop_adverse_fraction_from_entry: 0.018
  trailing_activation_favorable_fraction: 0.006
  trailing_retrace_fraction_from_best_completed_close: 0.004
  hard_stop_precedence_over_trailing_same_bar: true
  maximum_holding_bars: 24
  trigger_bar_is_not_fill_bar: true
  fill: next_exact_common_open_after_trigger
  missing_successor: unresolved_not_zero

target:
  basket_return: equal_notional_three_leg_entry_open_to_causal_exit_open
  model_label: doubled_cost_net_return_strictly_positive
  target_never_enters_candidate_or_feature_eligibility: true
  target_path_may_not_cross_session: true
  missing_entry_exit_or_path: unresolved_not_zero

model:
  family: sklearn_mlp_classifier_fixed_ensemble
  full_hidden_layers: [64, 32]
  aggregate_hidden_layers: [24, 12]
  activation: relu
  solver: adam
  alpha: 0.0005
  batch_size: 512
  learning_rate_init: 0.0005
  maximum_iterations: 70
  early_stopping: true
  validation_fraction_from_training_only: 0.15
  no_improvement_iterations: 8
  seeds: [1729, 2718]
  ensemble: arithmetic_mean_without_seed_selection
  fixed_trade_probability_threshold: 0.60
  probability_threshold_search: forbidden
  minimum_training_candidates: 500
  single_class_or_insufficient_history: sleep

folds:
  expanding_oos_years: [2022, 2023, 2024, 2025]
  first_training_start: '2020-02-20'
  training_end: prior_calendar_year_with_one_session_purge
  calibration: none
  test: exact_oos_calendar_year
  retrain_frequency: once_before_each_oos_year
  oos_targets_unread_during_inference: true
  hyperparameter_search: false

