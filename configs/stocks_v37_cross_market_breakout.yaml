  capacity_sizing_source: minimum_completed_decision_entry_exit_bar_value
  fractional_notional_proxy: true
  historical_lot_size_and_short_locate_missing: true
  one_way_commission_bps: 5.0
  one_way_slippage_bps: 5.0
  doubled_cost_multiplier: 2.0
  stress_cost_multiplier: 3.5
  annual_short_borrow_rate: 0.20
