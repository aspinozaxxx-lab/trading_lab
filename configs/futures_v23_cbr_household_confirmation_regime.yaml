information_set:
  source_availability: 23_59_59_Europe_Moscow_on_max_publication_and_last_update_date
  release_join: available_at_must_be_less_than_or_equal_to_decision_at
  selected_values:
    - exact_release_specific_XLSX_expected_inflation_12m_median
    - exact_release_specific_XLSX_consumer_sentiment_index
  html_chart_values: rounded_display_cross_check_only
  observed_inflation: archived_for_audit_forbidden_in_v23_signal
  revision_history: immediately_previous_release_month_for_each_selected_series
  decision_at: end_of_first_factual_MOEX_decision_session_on_or_after_available_local_date
  execution_not_before: exact_active_contract_open_on_next_factual_effective_date
  state_between_releases: carry_latest_snapshot_until_next_score_or_45_calendar_day_expiry
  same_available_at_collision: keep_latest_release_month
  same_decision_session_collision: keep_latest_causally_available_signal_or_expiry
  future_columns_forbidden: [open_D_plus_1, return_D_plus_1, target, label, pnl]
  no_zero_imputation: true
  no_gap_or_roll_return_bridge: true

signal:
  id: cbr_household_two_series_confirmation
  formula: >-
    risk_on_if_expected_inflation_delta_negative_and_consumer_sentiment_delta_positive;
    risk_off_if_expected_inflation_delta_positive_and_consumer_sentiment_delta_negative;
    otherwise_cash
  directions:
    SI: {risk_on: -1, risk_off: 1, interpretation: lower_inflation_expectations_support_RUB}
    RI: {risk_on: 1, risk_off: -1, interpretation: sentiment_confirmed_domestic_risk}
    MIX: {risk_on: 1, risk_off: -1, interpretation: sentiment_confirmed_domestic_risk}
    BR: {risk_on: 0, risk_off: 0, interpretation: no_direct_household_oil_hypothesis}
  mixed_or_zero_pair: cash
  magnitude_scaling: none
  threshold: none
  fit_or_outcome_training: none
  hyperparameter_search: false
  expiry_calendar_days: 45
  sealed_source_counts:
    releases: 48
    warmup_releases: 1
    scored_releases: 47
    scored_by_release_year: {2022: 11, 2023: 12, 2024: 12, 2025: 12}
    expected_inflation_delta_positive: 25
    expected_inflation_delta_negative: 22
    expected_inflation_delta_zero: 0
    consumer_sentiment_delta_positive: 24
    consumer_sentiment_delta_negative: 23
    consumer_sentiment_delta_zero: 0
    risk_on_confirmations: 16
    risk_off_confirmations: 17
    mixed_or_zero_confirmations: 14
    nonzero_asset_directions: 99
    source_only_expiry_states: 2
    modified_after_publication_pages: 1
    same_available_at_collision_rows: 2
    page_XLSX_display_matches: 48
    page_XLSX_exact_matches: 43

portfolio:
  universe_exact_order: [SI, RI, BR, MIX]
  active_signal_assets: [SI, RI, MIX]
  equal_absolute_risk_budget_each_active_asset: 0.3333333333333333
  BR_target_always_zero: true
  daily_volatility_lookback_sessions: 60
  annualization_sessions: 252
  annualized_volatility_floor: 0.10
  annual_target_volatility_each_asset: 0.20
  maximum_absolute_weight_each_active_asset: 0.3333333333333333
  target_formula: signal_times_one_third_times_min_1_and_0_20_divided_by_max_prior_60d_vol_and_0_10
  mandatory_additional_decisions: any_known_active_contract_change_for_nonzero_held_target
  gross_cap: 1.0

execution:
  initial_cash_rub: 1000000.0
  decision_to_fill: next_factual_effective_date_open
  integer_quantity: truncate_toward_zero_weight_times_current_cash_over_lagged_notional
  active_contract: exact_contract_known_at_decision_from_active_contract_map
  roll: explicit_old_exit_plus_new_entry_at_same_factual_open
  execution_atomicity: portfolio
  maximum_participation: 0.01
  participation_denominator: immediately_prior_factual_contract_volume
  maximum_gross_notional_multiple: 1.0
  initial_margin: modeled_25_percent_of_lagged_notional
  initial_margin_buffer_multiple: 2.0
  settlement_accounting: factual_variation_margin_with_open_gap_and_settlement_mark
  collateral_yield: 0.0
  terminal_policy: carry_with_terminal_exit_reserve_reported
  missing_or_unprovable: reject_or_unresolved_never_zero_return
  scenarios:
    primary: {slippage_ticks_per_leg: 1, conservative_fee_multiplier: 1.0}
    doubled: {slippage_ticks_per_leg: 2, conservative_fee_multiplier: 2.0}
    stress: {slippage_ticks_per_leg: 4, conservative_fee_multiplier: 2.0}
  limitations:
    historical_exchange_exact: false
    broker_exact: false
    queue_and_bid_ask_exact: false
    point_value_fee_and_margin: frozen_conservative_research_proxy
    cbr_original_historical_response_bytes: unavailable
    cbr_exact_intraday_publication_times: unavailable
    cbr_historical_content_immutability: not_cryptographically_proved

validation:
  scheme: fixed_development_OOS_after_source_only_causal_warmup
  source_history: "2022-01..2025-12_release_specific_current_retrieval"
  signal_warmup: first_release_has_no_position
  market_warmup: "2018-01-03..2020-12-31"
  oos: "2021-01-01..2025-12-31"
  active_signal_years: "2022..2025"
  model_training: none
  parameter_selection_on_oos: forbidden
  protected_2026_price_or_outcome_read: forbidden

promotion_rule:
  scope: go_to_new_unseen_validation_only_never_live
  require_all:
    - every_input_and_temporal_check_true
    - exactly_47_scored_releases_33_confirmations_and_99_nonzero_asset_directions
    - all_three_scenarios_execution_complete
    - zero_critical_failures_and_zero_unresolved_halts
    - primary_cagr_at_least_0_05
    - primary_sharpe_at_least_0_75
    - primary_maximum_drawdown_at_most_0_20
    - primary_positive_active_years_at_least_3_of_4
    - doubled_total_return_positive
    - stress_total_return_positive
    - no_gross_participation_or_margin_breach
  independent_confirmation_required: true

reporting:
