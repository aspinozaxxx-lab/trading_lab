protocol_id: futures_v23_cbr_household_confirmation_regime_v1
protocol_version: 1
status: sealed_before_any_v23_market_outcome_read
declared_at_utc: "2026-09-01T03:37:06Z"
research_only: true
sealed_before_outcomes: true
live_trading_allowed: false
parent_v12_protocol_sha256: 0b1a79d5c09cf40330886ebfba84bb9a7a8a84973301d59627200050e61b3e53
source_commit_before_protocol: 3d18a03
relationship_to_prior_work: >-
  A new official Bank of Russia household information family, independent of the
  business survey used in V22. Outcomes for 2021-2025 were seen in unrelated
  experiments and these historical release files were retrieved currently; V23 is one
  predeclared development challenger and never independent holdout confirmation.

hypothesis:
  statement: >-
    Falling one-year household inflation expectations together with improving consumer
    sentiment define a confirmed domestic risk-on and ruble-strength regime: long RI
    and MIX and short SI. Rising expected inflation together with falling sentiment is
    the symmetric risk-off regime. Every mixed or zero pair goes to cash, avoiding an
    outcome-selected magnitude threshold and requiring two economically distinct
    household series to agree.
  economic_mechanism:
    - lower_expected_inflation_reduces_ruble_debasement_and_rate_pressure
    - stronger_consumer_sentiment_supports_domestic_equity_risk
    - two_series_confirmation_filters_ambiguous_household_releases
    - confirmed_regime_persists_until_next_release_or_fixed_expiry
  primary_comparison: flat_cash_zero_return
  contextual_comparison_only: frozen_V12_and_V22_are_not_changed_or_combined
  reject_if:
    - any_source_identity_schema_raw_or_temporal_check_fails
    - any_release_is_used_before_its_conservative_available_at
    - same_timestamp_collision_does_not_keep_the_latest_release_month
    - any_mixed_or_zero_pair_produces_a_nonzero_target
    - any_critical_execution_failure_or_unresolved_halt_remains
    - primary_total_return_is_not_positive
    - doubled_or_stress_total_return_is_not_positive
  forbidden_followups_on_same_2021_2025_outcomes:
    - inverting_any_asset_or_component_sign
    - selecting_inflation_or_sentiment_magnitude_thresholds_or_scaling
    - trading_only_one_of_the_two_series_after_v23_metrics
    - converting_mixed_states_to_directional_positions
    - using_observed_inflation_in_the_signal
    - changing_risk_budgets_volatility_target_floor_or_expiry
    - changing_to_same_day_fill_or_earlier_release_availability
    - combining_with_V12_V22_or_other_signals_based_on_v23_metrics
    - presenting_currently_retrieved_files_as_original_publication_bytes

