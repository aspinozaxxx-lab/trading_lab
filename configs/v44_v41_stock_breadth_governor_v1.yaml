protocol_id: futures_v44_v41_stock_breadth_governor_v1
protocol_version: 1
status: sealed_before_any_daily_stock_breadth_state_or_governed_nav_metric
declared_at_utc: '2026-09-02T09:17:00Z'
research_only: true
live_trading_allowed: false

hypothesis: >-
  A broad deterioration across all thirty stocks is a causal equity-risk state that
  can reduce V41 drawdowns without adding leverage. On a state transition, move half
  of the frozen V39 allocation into the already frozen cash-carry idle-RUONIA sleeve;
  otherwise preserve holdings without daily rebalancing.

