    exact_tickers: 30
    fixed_current_universe_survivorship_disclosure: true

breadth:
  daily_close: final_exact_common_ten_minute_bar_close_per_Moscow_session
  return_lookback_sessions: 63
  inherited_horizon_reason: V39_already_freezes_63_session_horizon
  asset_state: close_t_divided_by_close_t_minus_63_minus_one_strictly_positive
  breadth_fraction: positive_asset_states_divided_by_exact_30
  minimum_available_assets: 30
  risk_off_if_strictly_below: 0.3333333333333333
  threshold_reason: at_least_two_thirds_of_stocks_nonpositive
  signal_available_after_final_bar_close: true
  applied_to_first_strictly_later_V41_session: true
  missing_or_warmup_state: preserve_previous_state_initial_normal
  no_threshold_lookback_or_sign_search: true

allocation:
  normal: {v39: 0.80, cash_carry_ruonia: 0.20}
  risk_off: {v39: 0.40, cash_carry_ruonia: 0.60}
  rebalance_only_on_state_transition: true
  no_rebalance_while_state_unchanged: true
  initial_state: normal
  leverage_added: false
  component_signals_trades_costs_and_navs_unchanged: true

scenarios:
  primary:
    v41_component_columns: [v39_primary_nav, cash_carry_ruonia_primary_nav]
    benchmark: primary
    one_way_cost_per_component_bps: 5.0
  doubled:
    v41_component_columns: [v39_doubled_nav, cash_carry_ruonia_doubled_nav]
    benchmark: doubled
    one_way_cost_per_component_bps: 10.0
  stress:
    v41_component_columns: [v39_stress_nav, cash_carry_ruonia_stress_nav]
    benchmark: stress
    one_way_cost_per_component_bps: 20.0

evaluation:
  start: '2020-12-30'
  end: '2025-12-30'
  protected_from: '2026-01-01'
  same_history_adaptive_evidence_not_independent_holdout: true

required_gates:
  all_scenario_CAGR_gte: 0.20
  all_scenario_Sharpe_gte_V41: true
  all_scenario_MDD_strictly_better_than_V41: true
  all_scenario_worst_year_gte_V41: true
  primary_positive_years_gte: 5
  live_promotion_forbidden: true

outputs:
  root: runs/v44_v41_stock_breadth_governor_v1
  immutable_timestamped_run: true
  required: [manifest.json, manifest.sha256, audit.json, metrics.json, report.md, daily_ledger.parquet, breadth_states.parquet]

post_outcome_rules:
  change_lookback_threshold_scale_cost_or_sign_on_same_history: forbidden
  select_subset_of_stocks_or_years: forbidden
  failed_result_action: forward_breadth_or_new_information_only

limitations:
  - The fixed current thirty-stock universe has survivorship bias and is not PIT constituents.
  - Stock candles are current-vintage and do not prove historical close-auction execution.
  - Reallocation is a normalized portfolio proxy without integer sizing or broker margin rules.
  - V41 and stock breadth overlap the same development history; this is not independent confirmation.
  - Historical evidence cannot guarantee profit or authorize live trading.
