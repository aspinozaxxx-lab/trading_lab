paths:
  root: ..
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  runs_dir: runs

universe:
  development:
    - SBER
    - GAZP
    - LKOH
    - NVTK
    - ROSN
    - TATN
    - MOEX
    - VTBR
    - CHMF
    - PHOR
    - RUAL
    - ALRS
    - MAGN
    - NLMK
    - SNGS
    - MGNT
    - GMKN
    - PLZL
    - SBERP
    - TATNP
  holdout:
    - AFKS
    - AFLT
    - BSPB
    - CBOM
    - ENPG
    - IRAO
    - MTSS
    - RTKM
    - SNGSP
    - TRNFP
  engine: stock
  market: shares
  board: TQBR
  timeframe: 10m

protocol:
  data_start: 2018-01-01
  train_end: 2022-12-31
  validation_start: 2023-01-01
  validation_end: 2023-12-31
  calibration_start: 2024-01-01
  calibration_end: 2024-12-31
  test_start: 2025-01-01
  test_end: 2026-08-16
  sequence_length: 192
  horizon_bars: 24
  train_stride_bars: 6
  evaluation_decision_slots:
    - 0
    - 24
    - 48
  embargo_bars: 48

download:
  timeout_seconds: 30
  max_retries: 4
  max_workers: 3
  page_size: 500
  request_pause_seconds: 0.03

model:
  channels: 128
  blocks: 6
  kernel_size: 3
  dropout: 0.10
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 512
  epochs: 15
  patience: 4
  classification_weight: 0.25
  gradient_clip: 1.0
  workers: 8
  precision: bf16

portfolio:
  initial_capital: 1000000.0
  commission_bps: 5.0
  slippage_bps: 2.0
  financing_rate_annual: 0.20
  missing_exit_return: -0.05
  top_k_candidates:
    - 1
    - 2
    - 3
  minimum_score_bps_candidates:
    - 7.0
    - 10.0
    - 14.0
    - 20.0
  keep_rank_candidates:
    - 1
    - 3
    - 5
  regime_filter_candidates:
    - true
    - false
  core_leverage: 1.0
  risk_scenarios:
    - 1.0
    - 1.5
    - 2.0
  target_cagr: 0.50
  maximum_core_drawdown: 0.30
  minimum_trades: 100

seed: 42
