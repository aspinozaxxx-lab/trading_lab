[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "market-lab"
version = "0.5.0"
description = "Local CPU/GPU laboratory for reproducible MOEX strategy research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib==1.5.3",
    "matplotlib==3.10.7",
    "numpy==2.3.3",
    "optuna==4.6.0",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "scikit-learn==1.8.0",
    "typer==0.24.1",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.15.14",
]
sequence = [
    "torch==2.13.0",
]

[project.scripts]
market-lab = "market_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
